<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEL 2.0 – Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="kalkulaator.js"></script>
<style>
  :root {
    --bg: #F4F4F4; --grid: #E6E6E6; --panel: #FFFFFF; --ink: #161616; --muted: #525252;
    --line: #E0E0E0; --line2: #C6C6C6; --accent: #0F62FE; --accent-dark: #0043CE;
    --danger: #DA1E28; --ok: #198038; --top: #161616; --sel: #EDF5FF;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); font-size: 14px;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* Sisselogimine */
  .login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .login-box h1 { margin: 0; font-size: 24px; }
  .login-box p { margin: 0; color: var(--muted); }

  /* Raam */
  .app { height: 100%; display: flex; flex-direction: column; }
  .top { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 20px; background: var(--top); color: #F4F4F4; }
  .top .brand { font-family: var(--mono); font-weight: 600; font-size: 16px; }
  .top .who { margin-left: auto; color: #C6C6C6; }
  .top button { background: transparent; border: 1px solid #6F6F6F; color: #F4F4F4; height: 32px; padding: 0 12px; }
  .top button:hover { border-color: #F4F4F4; }
  .body { flex-grow: 1; min-height: 0; display: flex; gap: 16px; padding: 16px 20px 20px; }
  nav.side { width: 200px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; padding: 8px 0; align-self: flex-start; }
  nav.side button { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 16px; border: none; background: transparent; text-align: left; font-weight: 500; border-left: 3px solid transparent; }
  nav.side button:hover { background: var(--bg); }
  nav.side button.on { border-left-color: var(--accent); background: var(--sel); font-weight: 700; }
  nav.side .n { font-family: var(--mono); color: var(--muted); font-size: 12px; }

  main.list { flex-grow: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 20px; margin-right: auto; }
  .search { height: 36px; width: 220px; padding: 0 10px; border: 1px solid var(--line2); background: var(--bg); }
  .check { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .btn { height: 36px; padding: 0 14px; border: 1px solid var(--line2); background: var(--panel); font-weight: 600; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.danger { color: var(--danger); border-color: var(--line2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { padding: 10px 14px; color: var(--muted); border-bottom: 1px solid var(--line); background: #FAFAFA; font-size: 13px; }
  .tablewrap { flex-grow: 1; min-height: 0; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--line); text-align: left; font-size: 12px; font-weight: 600; padding: 8px 12px; white-space: nowrap; }
  td { padding: 0; border-bottom: 1px solid var(--line); }
  td .cell { padding: 10px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #FAFAFA; }
  tr.row.sel td { background: var(--sel); }
  tr.row.off td { color: #8D8D8D; }
  td.num .cell { font-family: var(--mono); text-align: right; }
  td .rowbtn { all: unset; display: block; padding: 10px 12px; font-weight: 600; cursor: pointer; }
  td .rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tag { display: inline-block; padding: 1px 8px; font-size: 12px; font-weight: 600; border: 1px solid; }
  .tag.admin { color: #0043CE; background: #D0E2FF; border-color: #0043CE; }
  .tag.raamatupidaja { color: #6B5000; background: #FCF4D6; border-color: #B28600; }
  .tag.et { color: #393939; background: #F4F4F4; border-color: #8D8D8D; }
  .tag.en { color: #6929C4; background: #E8DAFF; border-color: #6929C4; }
  .tag.pinnakate { color: #6929C4; background: #E8DAFF; border-color: #6929C4; }
  .tag.allhange { color: #0043CE; background: #D0E2FF; border-color: #0043CE; }
  .tag.materjal { color: #6B5000; background: #FCF4D6; border-color: #B28600; }
  .tag.muu { color: #393939; background: #F4F4F4; border-color: #8D8D8D; }
  .tag.toomees { color: #0E6027; background: #DEFBE6; border-color: #0E6027; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }

  aside.edit { width: 380px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside.edit header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  aside.edit header h3 { margin: 0; font-size: 18px; }
  .form { flex-grow: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input[type=text], .field input[type=email], .field input[type=password], .field select, .field textarea {
    height: 38px; padding: 0 10px; border: 1px solid var(--line2); border-bottom-color: #8D8D8D; background: var(--bg); width: 100%;
  }
  .field textarea { height: 72px; padding: 8px 10px; resize: vertical; }
  .field input.num { font-family: var(--mono); }
  .field input:focus, .field select:focus, .field textarea:focus, .search:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .field.bool { flex-direction: row; align-items: center; gap: 8px; }
  .field.bool label { font-size: 14px; color: var(--ink); }
  .field.bool input { width: 18px; height: 18px; }
  .actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .actions .btn.primary { flex-grow: 1; height: 44px; }
  .actions .btn { height: 44px; }
  .sub { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .sub h4 { margin: 0; font-size: 14px; }
  .contact { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); }
  .contact small { display: block; color: var(--muted); }
  .contact button { border: none; background: transparent; color: var(--danger); font-weight: 600; height: 32px; }
  .contact-add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .contact-add input { height: 34px; padding: 0 8px; border: 1px solid var(--line2); background: var(--bg); min-width: 0; }
  .contact-add .btn { grid-column: span 2; height: 34px; }
  .placeholder { flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
  .err { color: var(--danger); font-size: 13px; }

  body.orders aside.edit, body.orders .check { display: none; }
  .ord-head { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); background: #FAFAFA; }
  .ord-head .wide { grid-column: span 2; }
  .ord-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .ord-bar h3 { margin: 0; font-size: 18px; font-family: var(--mono); }
  .ord-bar .sum { margin-left: auto; font-family: var(--mono); color: var(--muted); }
  table.rows { min-width: 1180px; }
  table.rows th { font-size: 11px; padding: 6px 6px; }
  table.rows td { padding: 4px 3px; border-bottom: none; vertical-align: top; }
  table.rows tr.r td:first-child { padding-left: 10px; }
  table.rows input, table.rows select { width: 100%; height: 32px; padding: 0 6px; border: 1px solid var(--line2); background: #fff; min-width: 0; }
  table.rows input.num { font-family: var(--mono); text-align: right; }
  table.rows input.norm { background: #FCF4D6; }
  table.rows tr.h td { padding: 0 3px 8px 10px; border-bottom: 1px solid var(--line); }
  .hist { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 18px; }
  .hist b { color: var(--ink); font-weight: 600; }
  .hist button { border: 1px solid var(--accent); color: var(--accent); background: #fff; height: 24px; padding: 0 8px; font-size: 12px; font-weight: 600; }
  .hist.new { color: #0E6027; }
  .xbtn { border: none; background: transparent; color: var(--danger); font-size: 18px; height: 32px; width: 32px; }
  .cells { display: flex; gap: 2px; flex-wrap: wrap; max-width: 220px; }
  .cells span { width: 12px; height: 12px; border: 1px solid; }
  .c-cam { background: #fff; border-color: #B28600 !important; }
  .c-toos { background: #78A9FF; border-color: #0043CE !important; }
  .c-ok, .c-valmis { background: #24A148; border-color: #0E6027 !important; }
  .c-pinnakattes, .c-allhankes { background: #D4BBFF; border-color: #6929C4 !important; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; background: #262626; color: #fff; font-weight: 600; z-index: 10; max-width: 90vw; }
  #toast.bad { background: var(--danger); }

  @media (max-width: 900px) {
    .body { flex-direction: column; padding: 12px; }
    nav.side { width: 100%; flex-direction: row; overflow-x: auto; padding: 0; }
    nav.side button { border-left: none; border-bottom: 3px solid transparent; flex-shrink: 0; gap: 8px; }
    nav.side button.on { border-bottom-color: var(--accent); }
    aside.edit { width: 100%; }
    .search { width: 100%; }
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form class="login-box" id="loginForm">
    <h1>TEL 2.0</h1>
    <p>Logi sisse oma e-posti ja parooliga.</p>
    <div class="field"><label for="email">E-post</label><input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label for="pass">Parool</label><input type="password" id="pass" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit" id="loginBtn" style="height:44px">Logi sisse</button>
  </form>
</div>

<div id="app" class="app hidden">
  <div class="top">
    <span class="brand">TEL 2.0</span><span>Admin</span>
    <span class="who" id="who"></span>
    <button id="home" type="button" onclick="location.href='index.html'">Avaleht</button>
    <button id="logout" type="button">Logi välja</button>
  </div>
  <div class="body">
    <nav class="side" id="nav" aria-label="Jaotised"></nav>
    <main class="list">
      <div class="toolbar">
        <h2 id="title"></h2>
        <input class="search" id="search" type="search" placeholder="Otsi" aria-label="Otsi">
        <label class="check"><input type="checkbox" id="showOff"> Näita ka mitteaktiivseid</label>
        <button class="btn primary" id="addBtn" type="button">Lisa uus</button>
      </div>
      <div class="note hidden" id="note"></div>
      <div class="tablewrap" id="table"></div>
    </main>
    <aside class="edit" id="edit"></aside>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>

<script>
// ---------------------------------------------------------------
// Ühendus. Publishable võti on mõeldud avalikuks, kaitse tuleb RLS-ist.
// ---------------------------------------------------------------
const SUPABASE_URL = 'https://abbwugsoakvirqlmovzt.supabase.co';
const SUPABASE_KEY = 'sb_publishable__5gmN-qWgogdCAJ7GAZq0w_XBA93LKs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------------------------------------------------------------
// Jaotised ja väljad
// ---------------------------------------------------------------
const ROLLID = [['admin', 'Admin'], ['raamatupidaja', 'Raamatupidaja'], ['toomees', 'Töömees']];
const ENT = {
  kasutajad: {
    table: 'profiilid', title: 'Kasutajad', one: 'kasutaja', canInsert: false, order: 'nimi',
    note: 'Uue kasutaja loomine: Supabase → Authentication → Users → Add user. Pärast seda ilmub ta siia ja saad määrata rolli ja tasu.',
    fields: [
      { k: 'nimi', l: 'Nimi', t: 'text', req: true, list: true },
      { k: 'roll', l: 'Roll', t: 'select', opts: ROLLID, list: true },
      { k: 'pohipalk', l: 'Põhipalk, €', t: 'num', list: true },
      { k: 'normtunni_tasu', l: 'Normtunni tasu, €', t: 'num', list: true },
      { k: 'aktiivne', l: 'Aktiivne', t: 'bool', list: true }
    ]
  },
  kliendid: {
    table: 'kliendid', title: 'Kliendid', one: 'klient', canInsert: true, order: 'nimi', contacts: true,
    fields: [
      { k: 'nimi', l: 'Nimi', t: 'text', req: true, list: true },
      { k: 'aadress', l: 'Aadress (tänav, küla)', t: 'text' },
      { k: 'postiindeks', l: 'Postiindeks', t: 'text' },
      { k: 'linn', l: 'Linn / vald', t: 'text', list: true },
      { k: 'riik', l: 'Riik', t: 'text', def: 'Eesti', req: true },
      { k: 'keel', l: 'Arve keel', t: 'select', opts: [['et', 'Eesti'], ['en', 'Inglise']], def: 'et', list: true },
      { k: 'arve_email', l: 'Arve e-post', t: 'text', list: true },
      { k: 'maksetahtaeg_paevi', l: 'Maksetähtaeg, päeva', t: 'int', list: true, def: 14, req: true },
      { k: 'kmkr', l: 'KMKR nr', t: 'text' },
      { k: 'reg_kood', l: 'Registrikood', t: 'text' },
      { k: 'email', l: 'Üldine e-post', t: 'text' },
      { k: 'telefon', l: 'Telefon', t: 'text' },
      { k: 'vaikimisi_tarneaeg_paevi', l: 'Vaikimisi tarneaeg, päeva', t: 'int' },
      { k: 'markused', l: 'Märkused', t: 'area' },
      { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
    ]
  },
  pingid: {
    table: 'pingid', title: 'Pingid', one: 'pink', canInsert: true, order: 'nimi',
    fields: [
      { k: 'nimi', l: 'Nimi', t: 'text', req: true, list: true },
      { k: 'tunnihind', l: 'Tunnihind, €/h', t: 'num', req: true, list: true },
      { k: 'markused', l: 'Märkused', t: 'area', list: true },
      { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
    ]
  },
  materjalid: {
    table: 'materjalid', title: 'Materjalid', one: 'materjal', canInsert: true, order: 'nimetus',
    fields: [
      { k: 'nimetus', l: 'Nimetus', t: 'text', req: true, list: true },
      { k: 'analoogid', l: 'Analoogid (komaga eraldatud)', t: 'tags', list: true },
      { k: 'tihedus', l: 'Tihedus, kg/dm³', t: 'num', list: true, dec: 3 },
      { k: 'hind_kg', l: 'Hind, €/kg', t: 'num', list: true },
      { k: 'markused', l: 'Märkused', t: 'area', list: true },
      { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
    ]
  }
};

ENT.pinnakatted = {
  table: 'pinnakatted', title: 'Pinnakatted', one: 'pinnakate', canInsert: true, order: 'nimetus',
  fields: [
    { k: 'nimetus', l: 'Nimetus', t: 'text', req: true, list: true },
    { k: 'tarnija', l: 'Tarnija', t: 'text', list: true },
    { k: 'email', l: 'E-post (tellimuste saatmiseks)', t: 'text', list: true },
    { k: 'markused', l: 'Märkused', t: 'area', list: true },
    { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
  ]
};
ENT.tarnijad = {
  table: 'tarnijad', title: 'Tarnijad', one: 'tarnija', canInsert: true, order: 'nimi',
  fields: [
    { k: 'nimi', l: 'Nimi', t: 'text', req: true, list: true },
    { k: 'liik', l: 'Liik', t: 'select', opts: [['pinnakate', 'Pinnakate'], ['allhange', 'Allhange'], ['materjal', 'Materjal'], ['muu', 'Muu']], def: 'muu', list: true },
    { k: 'email', l: 'E-post (tellimused)', t: 'text', list: true },
    { k: 'kontakt', l: 'Kontaktisik', t: 'text', list: true },
    { k: 'telefon', l: 'Telefon', t: 'text' },
    { k: 'markused', l: 'Märkused', t: 'area' },
    { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
  ]
};
ENT.km = {
  table: 'km_maarad', title: 'Käibemaks', one: 'käibemaksumäär', canInsert: true, order: 'kehtib_alates', noActive: true,
  note: 'Uus määr kehtib alates valitud kuupäevast. Olemasolevad ostutellimused ja arved jäävad oma loomisel kehtinud määraga.',
  fields: [
    { k: 'maar', l: 'Määr, %', t: 'num', req: true, list: true, dec: 0 },
    { k: 'kehtib_alates', l: 'Kehtib alates', t: 'date', req: true, list: true },
    { k: 'markus', l: 'Märkus', t: 'text', list: true }
  ]
};
ENT.tellimused = { table: 'tellimused', title: 'Tellimused', custom: true, canInsert: true };
const NAV = ['tellimused', 'kasutajad', 'kliendid', 'tarnijad', 'pingid', 'materjalid', 'pinnakatted', 'km'];
const S = { tab: 'tellimused', rows: [], counts: {}, sel: null, isNew: false, q: '', showOff: false, contacts: [] };
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = (v, dec = 2) => v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('et-EE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const nameKey = (e) => e.fields[0].k;

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg; t.className = bad ? 'bad' : '';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'hidden', 3500);
}
function errText(err) {
  if (!err) return 'Tundmatu viga.';
  if (err.code === '23505') return 'Selle nimega kirje on juba olemas.';
  if (err.code === '42501') return 'Sul pole selleks õigusi.';
  if (err.code === '23503') return 'Kirjet kasutatakse mujal, seda ei saa kustutada. Märgi see mitteaktiivseks.';
  return err.message || String(err);
}

// ---------------------------------------------------------------
// Sisselogimine
// ---------------------------------------------------------------
async function start() {
  const { data } = await sb.auth.getSession();
  if (data.session) await enter(data.session.user); else showLogin();
}
function showLogin(msg) {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('loginErr').textContent = msg || '';
}
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Vale e-post või parool.'; return; }
  await enter(data.user);
});
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

async function enter(user) {
  const { data: me, error } = await sb.from('profiilid').select('nimi, roll, aktiivne').eq('id', user.id).single();
  if (error || !me) { await sb.auth.signOut(); return showLogin('Kasutaja profiili ei leitud.'); }
  if (me.roll !== 'admin' || !me.aktiivne) { await sb.auth.signOut(); return showLogin('Admini paneel on ainult admin-rolliga kasutajatele.'); }
  $('who').textContent = me.nimi;
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  await loadCounts();
  await openTab(S.tab);
}

// ---------------------------------------------------------------
// Andmed
// ---------------------------------------------------------------
async function loadCounts() {
  await Promise.all(NAV.map(async (k) => {
    let q = sb.from(ENT[k].table).select('*', { count: 'exact', head: true });
    if (!ENT[k].custom && !ENT[k].noActive) q = q.eq('aktiivne', true);
    const { count } = await q;
    S.counts[k] = count ?? 0;
  }));
  renderNav();
}
async function openTab(tab) {
  S.tab = tab; S.sel = null; S.isNew = false; S.q = ''; $('search').value = '';
  document.body.classList.toggle('orders', !!ENT[tab].custom);
  O = null;
  renderNav();
  if (ENT[tab].custom) { $('table').innerHTML = '<div class="empty">Laen…</div>'; await ordersOpen(); return; }

function fieldHtml(f, v) {

function readForm(e) {
  const out = {}; const errs = [];
  e.fields.forEach((f) => {
    const el = $('f_' + f.k);
    if (f.t === 'bool') { out[f.k] = el.checked; return; }
    let v = el.value.trim();
    if (f.t === 'tags') { out[f.k] = v ? [...new Set(v.split(/[,;]/).map((x) => x.trim()).filter(Boolean))] : []; return; }
    if (f.t === 'num' || f.t === 'int') {
      if (v === '') v = null;
      else {
        const n = Number(v.replace(/\s/g, '').replace(',', '.'));
        if (Number.isNaN(n)) { errs.push(f.l + ': peab olema number.'); return; }
        v = f.t === 'int' ? Math.round(n) : n;
      }
    } else if (v === '') v = null;
    if (f.req && (v === null || v === '')) errs.push(f.l + ' on kohustuslik.');
    out[f.k] = v;
  });
  return { out, errs };
}
async function save() {
  const e = ENT[S.tab];
  const { out, errs } = readForm(e);
  if (errs.length) { $('formErr').textContent = errs.join(' '); return; }
  $('saveBtn').disabled = true;
  const q = S.isNew ? sb.from(e.table).insert(out) : sb.from(e.table).update(out).eq('id', S.sel.id);
  const { data, error } = await q.select().single();
  $('saveBtn').disabled = false;
  if (error) { $('formErr').textContent = errText(error); return; }
  toast(S.isNew ? 'Lisatud: ' + data[nameKey(e)] : 'Salvestatud');
  S.isNew = false; S.sel = data;
  await loadRows();
  S.sel = S.rows.find((x) => x.id === data.id) || data;
  if (e.contacts) await loadContacts(data.id);
  renderList(); renderEdit(); loadCounts();
}
async function addContact() {
  const nimi = $('c_nimi').value.trim();
  if (!nimi) { $('formErr').textContent = 'Ostja nimi on kohustuslik.'; return; }
  const { error } = await sb.from('kontaktid').insert({ klient_id: S.sel.id, nimi, telefon: $('c_tel').value.trim() || null, email: $('c_email').value.trim() || null });
  if (error) { $('formErr').textContent = errText(error); return; }
  toast('Ostja lisatud');
  await loadContacts(S.sel.id); renderEdit();
}
async function delContact(id) {
  const c = S.contacts.find((x) => String(x.id) === String(id));
  if (!confirm('Eemaldada ostja ' + (c ? c.nimi : '') + '?')) return;
  const { error } = await sb.from('kontaktid').delete().eq('id', id);
  if (error) { toast(errText(error), true); return; }
  toast('Ostja eemaldatud');
  await loadContacts(S.sel.id); renderEdit();
}

      '<th style="width:10%">Materjal</th><th style="width:6%">Mat. €/tk</th><th style="width:10%">Pink</th><th style="width:11%">Teostaja</th><th style="width:6%">Norm, h</th><th style="width:9%">Staatus</th><th style="width:3%"></th>' +
    '</tr></thead><tbody id="oRows">' + O.rows.map(rowHtml).join('') + '</tbody></table></div>' +
    '<div style="padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="oAdd">+ Lisa rida</button>' +
    '<button type="button" class="btn" id="oImp">Impordi Excelist</button><input type="file" id="oFile" accept=".xlsx,.xls,.csv" class="hidden">' +
    '<span style="color:var(--muted);font-size:13px">Vihje: kleebi Excelist või PDF-ist mitu rida korraga (nimetus, kogus, hind) esimese rea nimetuse lahtrisse.</span></div>' +
    '<div class="err" id="oErr" style="padding:0 14px 14px"></div>';
  orderSum();
  $('oBack').addEventListener('click', () => { O = null; ordersOpen(); });
  $('oSave').addEventListener('click', orderSave);
  $('oAdd').addEventListener('click', () => { O.rows.push(blankRow()); rerenderRows(); });
  $('oImp').addEventListener('click', () => $('oFile').click());
  $('oFile').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importExcel(f); });
  $('oKlient').addEventListener('change', (e) => {
    O.klient_id = e.target.value ? Number(e.target.value) : null; O.kontakt_id = null;
    const k = L.kliendid.find((x) => x.id === O.klient_id);
    if (k && !O.tarneaeg && k.vaikimisi_tarneaeg_paevi) O.tarneaeg = isoToday(k.vaikimisi_tarneaeg_paevi);
    orderReadHead(); orderRender(); O.rows.forEach((r, i) => r.nimetus && loadHistory(i));
  });
}
function rerenderRows() { orderReadHead(); $('oRows').innerHTML = O.rows.map(rowHtml).join(''); orderSum(); }
function parseDate(v) {
  v = (v || '').trim(); if (!v) return null;
  let m = v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  return undefined;
}
function orderReadHead() {
  if (!$('oKt')) return;
  O.kontakt_id = $('oKontakt').value ? Number($('oKontakt').value) : null;
  O.kliendi_tellimus = $('oKt').value.trim();
  const d = parseDate($('oTa').value); if (d !== undefined) O.tarneaeg = d || '';
  O.markused = $('oMk').value.trim();
}
function calcNorm(r) {
  if (r.normManual || r.allhange) return;
  const p = L.pingid.find((x) => x.id === r.pink_id);
  if (!p || !r.tk_hind || !r.kogus) { return; }
  r.norm = Math.max(0, Math.round(((r.tk_hind - (r.materjali_hind || 0)) * r.kogus / p.tunnihind) * 100) / 100);
}
function orderSum() {
  const s = O.rows.reduce((a, r) => a + (r.kogus || 0) * (r.tk_hind || 0), 0);
  const n = O.rows.reduce((a, r) => a + (r.norm || 0), 0);
  if ($('oSum')) $('oSum').textContent = O.rows.length + ' rida, ' + fmtNum(s) + ' €, norm ' + fmtNum(n) + ' h';
}
const histTimers = {};
async function loadHistory(i) {
  const r = O.rows[i]; if (!r) return;
  const name = (r.nimetus || '').trim();
  if (!name) { r.hist = null; const el = $('hist' + i); if (el) el.innerHTML = ''; return; }
  r.hist = null; const el0 = $('hist' + i); if (el0) el0.innerHTML = histHtml(r, i);
  let q = sb.from('tellimuse_read').select('id,nimetus,kogus,tk_hind,norm,materjal_id,materjali_hind,pink_id,allhange,loodud,tellimused!inner(nr,klient_id)')
    .ilike('nimetus', name).order('loodud', { ascending: false }).limit(5);
  if (r.id) q = q.neq('id', r.id);
  const { data } = await q;
  if (O.rows[i] !== r) return;
  r.hist = data || [];
  const el = $('hist' + i); if (el) el.innerHTML = histHtml(r, i);
}
$('table').addEventListener('input', (ev) => {
  if (!O) return;
  const t = ev.target; const i = Number(t.dataset.i); const k = t.dataset.k; if (!k || Number.isNaN(i)) return;
  const r = O.rows[i];
  if (['kogus', 'tk_hind', 'materjali_hind'].includes(k)) r[k] = num(t.value);
  else if (k === 'norm') { r.norm = num(t.value); r.normManual = t.value.trim() !== ''; }
  else if (k === 'nimetus') { r.nimetus = t.value; clearTimeout(histTimers[i]); histTimers[i] = setTimeout(() => loadHistory(i), 450); }
  else if (k === 'uhik' || k === 'allhankija') r[k] = t.value;
  if (['kogus', 'tk_hind', 'materjali_hind'].includes(k)) { calcNorm(r); const n = $('oRows').querySelector('input[data-i="' + i + '"][data-k="norm"]'); if (n && document.activeElement !== n) n.value = numIn(r.norm); }
  orderSum();
});
$('table').addEventListener('change', (ev) => {
  if (!O) return;
  const t = ev.target; const i = Number(t.dataset.i); const k = t.dataset.k; if (!k || Number.isNaN(i)) return;
  const r = O.rows[i];
  if (k === 'pink') {
    if (t.value === 'allhange') { r.allhange = true; r.pink_id = null; r.teostaja_id = null; r.norm = null; if (r.staatus === 'cam') r.staatus = 'allhankes'; }
    else { r.allhange = false; r.allhankija = null; r.pink_id = t.value ? Number(t.value) : null; if (r.staatus === 'allhankes') r.staatus = 'cam'; calcNorm(r); }
    rerenderRows(); return;
  }
  if (k === 'materjal_id' || k === 'teostaja_id') r[k] = t.value ? (k === 'teostaja_id' ? t.value : Number(t.value)) : null;
  if (k === 'staatus') r.staatus = t.value;
  if (k === 'tahtaeg') r.tahtaeg = t.value || null;
});
$('table').addEventListener('click', (ev) => {
  if (!ENT[S.tab].custom) return;
  const open = ev.target.closest('[data-oid]'); if (open && !O) { orderOpen(Number(open.dataset.oid)); return; }
  const del = ev.target.closest('[data-del]');
  if (del && O) { const i = Number(del.dataset.del); const r = O.rows[i]; if (r.id) O.removed.push(r.id); O.rows.splice(i, 1); if (!O.rows.length) O.rows.push(blankRow()); rerenderRows(); O.rows.forEach((x, j) => { if (x.hist === null && x.nimetus) loadHistory(j); }); return; }
  const use = ev.target.closest('[data-use]');
  if (use && O) {
    const i = Number(use.dataset.use); const r = O.rows[i]; const h = r.hist && r.hist[0]; if (!h) return;
    r.tk_hind = h.tk_hind; r.materjal_id = h.materjal_id; r.materjali_hind = h.materjali_hind;
    r.allhange = h.allhange; r.pink_id = h.pink_id;
    if (h.norm && h.kogus && r.kogus) { r.norm = Math.round(h.norm / h.kogus * r.kogus * 100) / 100; r.normManual = true; } else { r.normManual = false; calcNorm(r); }
    rerenderRows(); O.rows.forEach((x, j) => { if (x.nimetus) { const el = $('hist' + j); if (el) el.innerHTML = histHtml(x, j); } });
    toast('Väärtused võetud eelmiselt korralt');
  }
});
$('table').addEventListener('dblclick', (ev) => {
  if (!O) return;
  const t = ev.target.closest('input[data-k="materjali_hind"]'); if (!t) return;
  const i = Number(t.dataset.i); const r = O.rows[i]; if (!r) return;
  TELKalk.open({ nimetus: r.nimetus || 'Uus rida', kogus: r.kogus || 0, materjalid: L.materjalid, materjal_id: r.materjal_id, onApply: (res) => {
    r.materjali_hind = res.mat; r.materjal_id = res.materjal_id;
    if (res.anood > 0) { r.ostuhind = res.anood; r.pinnakate = res.tyyp; }
    calcNorm(r);
    rerenderRows();
    const inp = $('oRows').querySelector('input[data-i="' + i + '"][data-k="materjali_hind"]'); if (inp) { inp.focus(); inp.style.background = '#DEFBE6'; setTimeout(() => { inp.style.background = ''; }, 1200); }
    toast('Materjal ' + fmtNum(res.mat) + ' €/tk' + (res.anood ? ', ' + res.tyyp.toLowerCase() + ' ' + fmtNum(res.anood) + ' €/tk' : '') + '. Salvesta tellimus.');
  } });
});
$('table').addEventListener('paste', (ev) => {
  if (!O) return;
  const t = ev.target; if (t.dataset.k !== 'nimetus') return;
  const text = (ev.clipboardData || window.clipboardData).getData('text');
  if (!/[\t\n]/.test(text.trim())) return;
  ev.preventDefault();
  const i0 = Number(t.dataset.i);
  const lines = text.replace(/\r/g, '').split('\n').map((l) => l.trim()).filter(Boolean);
  const newRows = lines.map((l) => {
    const c = l.split('\t'); const r = blankRow();
    r.nimetus = (c[0] || '').trim(); if (c[1]) r.kogus = num(c[1]) ?? 1; if (c[2]) r.tk_hind = num(c[2]);
    return r;
  });
  const cur = O.rows[i0];
  if (cur && !cur.nimetus) O.rows.splice(i0, 1, ...newRows); else O.rows.splice(i0 + 1, 0, ...newRows);
  rerenderRows(); O.rows.forEach((r, j) => r.nimetus && r.hist === null && loadHistory(j));
  toast(newRows.length + ' rida lisatud');
});
// ---------------- Exceli import (Joonise nr, Kogus, Hind, Tarneaeg)
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => bad(new Error('Exceli lugejat ei saanud laadida')); document.head.appendChild(sc); });
}
function cellDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return d.toISOString().slice(0, 10); }
  const p = parseDate(String(v)); return p || null;
}
async function importExcel(file) {
  try {
    await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    const RX = { nimetus: /joonis|nimetus|detail|part|drawing/i, kogus: /kogus|qty|quantity|kog/i, hind: /hind|price|€/i, tarne: /tarne|tähtaeg|tahtaeg|delivery|date|kuup/i };
    let hi = grid.findIndex((row) => row && row.some((c) => typeof c === 'string' && RX.nimetus.test(c)));
    let col = { nimetus: 0, kogus: 1, hind: 2, tarne: 3 };
    if (hi >= 0) {
      const h = grid[hi].map((c) => (c === null ? '' : String(c)));
      Object.keys(RX).forEach((k) => { const i = h.findIndex((c) => RX[k].test(c)); if (i >= 0) col[k] = i; });
    }
    const data = grid.slice(hi + 1).filter((row) => row && row[col.nimetus] !== null && String(row[col.nimetus]).trim() !== '');
    if (!data.length) { toast('Failist ei leitud ühtegi rida', true); return; }
    const newRows = data.map((row) => {
      const r = blankRow();
      r.nimetus = String(row[col.nimetus]).trim();
      r.kogus = num(row[col.kogus]) ?? 1;
      r.tk_hind = num(row[col.hind]);
      r.tahtaeg = cellDate(row[col.tarne]);
      return r;
    });
    orderReadHead();
    const empty = O.rows.filter((r) => !(r.nimetus || '').trim()).length === O.rows.length;
    O.rows = empty ? newRows : O.rows.concat(newRows);
    if (!O.tarneaeg) { const d = newRows.map((r) => r.tahtaeg).filter(Boolean).sort()[0]; if (d) O.tarneaeg = d; }
    orderRender();
    O.rows.forEach((r, i) => r.nimetus && r.hist === null && loadHistory(i));
    toast(newRows.length + ' rida imporditud failist ' + file.name);
  } catch (e) { toast('Import ebaõnnestus: ' + e.message, true); }
}
async function orderSave() {
  orderReadHead();
  const err = (m) => { $('oErr').textContent = m; };
  if (!O.klient_id) return err('Vali klient.');
  if (parseDate($('oTa').value) === undefined) return err('Tarneaeg peab olema kujul pp.kk.aaaa.');
  const rows = O.rows.filter((r) => (r.nimetus || '').trim());
  if (!rows.length) return err('Lisa vähemalt üks rida.');
  const bad = rows.find((r) => r.kogus === null || r.kogus <= 0);
  if (bad) return err('Rea "' + bad.nimetus + '" kogus puudub.');
  $('oSave').disabled = true; err('');
  const head = { klient_id: O.klient_id, kontakt_id: O.kontakt_id, kliendi_tellimus: O.kliendi_tellimus || null, tarneaeg: O.tarneaeg || null, markused: O.markused || null };
  try {
    let id = O.id;
    if (!id) {
      const { data, error } = await sb.from('tellimused').insert(head).select('id,nr').single();
      if (error) throw error; id = data.id; O.id = id; O.nr = data.nr;
    } else {
      const { error } = await sb.from('tellimused').update(head).eq('id', id); if (error) throw error;
    }
    const payload = (r) => ({ tellimus_id: id, nimetus: r.nimetus.trim(), kogus: r.kogus, uhik: r.uhik || 'tk', tk_hind: r.tk_hind || 0, tahtaeg: r.tahtaeg || null,
      materjal_id: r.materjal_id, materjali_hind: r.materjali_hind, pink_id: r.pink_id, allhange: r.allhange, allhankija: r.allhankija,
      teostaja_id: r.teostaja_id || null, norm: r.norm, staatus: r.staatus, pinnakate: r.pinnakate, ostuhind: r.ostuhind, markused: r.markused });
    const ins = rows.filter((r) => !r.id).map(payload);
    if (ins.length) { const { error } = await sb.from('tellimuse_read').insert(ins); if (error) throw error; }
    for (const r of rows.filter((x) => x.id)) { const { error } = await sb.from('tellimuse_read').update(payload(r)).eq('id', r.id); if (error) throw error; }
    if (O.removed.length) { const { error } = await sb.from('tellimuse_read').delete().in('id', O.removed); if (error) throw error; }
    toast('Salvestatud: ' + O.nr);
    await orderOpen(id); loadCounts();
  } catch (e) { err(errText(e)); }
  finally { if ($('oSave')) $('oSave').disabled = false; }
}
