<style>
  :root {
    --bg: #F4F4F4; --grid: #E6E6E6; --panel: #FFFFFF; --ink: #161616; --muted: #525252;
    --line: #E0E0E0; --line2: #C6C6C6; --accent: #0F62FE; --accent-dark: #0043CE;
    --danger: #DA1E28; --ok: #198038; --top: #161616; --sel: #EDF5FF;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); font-size: 14px;
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  /* Sisselogimine */
  .login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .login-box h1 { margin: 0; font-size: 24px; }
  .login-box p { margin: 0; color: var(--muted); }

  /* Raam */
  .app { height: 100%; display: flex; flex-direction: column; }
  .top { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding: 0 20px; background: var(--top); color: #F4F4F4; }
  .top .brand { font-family: var(--mono); font-weight: 600; font-size: 16px; }
  .top .who { margin-left: auto; color: #C6C6C6; }
  .top button { background: transparent; border: 1px solid #6F6F6F; color: #F4F4F4; height: 32px; padding: 0 12px; }
  .top button:hover { border-color: #F4F4F4; }
  .body { flex-grow: 1; min-height: 0; display: flex; gap: 16px; padding: 16px 20px 20px; }
  nav.side { width: 200px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; padding: 8px 0; align-self: flex-start; }
  nav.side button { display: flex; justify-content: space-between; align-items: center; height: 44px; padding: 0 16px; border: none; background: transparent; text-align: left; font-weight: 500; border-left: 3px solid transparent; }
  nav.side button:hover { background: var(--bg); }
  nav.side button.on { border-left-color: var(--accent); background: var(--sel); font-weight: 700; }
  nav.side .n { font-family: var(--mono); color: var(--muted); font-size: 12px; }

  main.list { flex-grow: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 20px; margin-right: auto; }
  .search { height: 36px; width: 220px; padding: 0 10px; border: 1px solid var(--line2); background: var(--bg); }
  .check { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .btn { height: 36px; padding: 0 14px; border: 1px solid var(--line2); background: var(--panel); font-weight: 600; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.danger { color: var(--danger); border-color: var(--line2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .note { padding: 10px 14px; color: var(--muted); border-bottom: 1px solid var(--line); background: #FAFAFA; font-size: 13px; }
  .tablewrap { flex-grow: 1; min-height: 0; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: var(--line); text-align: left; font-size: 12px; font-weight: 600; padding: 8px 12px; white-space: nowrap; }
  td { padding: 0; border-bottom: 1px solid var(--line); }
  td .cell { padding: 10px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #FAFAFA; }
  tr.row.sel td { background: var(--sel); }
  tr.row.off td { color: #8D8D8D; }
  td.num .cell { font-family: var(--mono); text-align: right; }
  td .rowbtn { all: unset; display: block; padding: 10px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  td .rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tag { display: inline-block; padding: 1px 8px; font-size: 12px; font-weight: 600; border: 1px solid; }
  .tag.admin { color: #0043CE; background: #D0E2FF; border-color: #0043CE; }
  .tag.raamatupidaja { color: #6B5000; background: #FCF4D6; border-color: #B28600; }
  .tag.et { color: #393939; background: #F4F4F4; border-color: #8D8D8D; }
  .tag.en { color: #6929C4; background: #E8DAFF; border-color: #6929C4; }
  .tag.pinnakate { color: #6929C4; background: #E8DAFF; border-color: #6929C4; }
  .tag.allhange { color: #0043CE; background: #D0E2FF; border-color: #0043CE; }
  .tag.materjal { color: #6B5000; background: #FCF4D6; border-color: #B28600; }
  .tag.muu { color: #393939; background: #F4F4F4; border-color: #8D8D8D; }
  .tag.toomees { color: #0E6027; background: #DEFBE6; border-color: #0E6027; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }

  aside.edit { width: 380px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside.edit header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  aside.edit header h3 { margin: 0; font-size: 18px; }
  .form { flex-grow: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input[type=text], .field input[type=email], .field input[type=password], .field select, .field textarea {
    height: 38px; padding: 0 10px; border: 1px solid var(--line2); border-bottom-color: #8D8D8D; background: var(--bg); width: 100%;
  }
  .field textarea { height: 72px; padding: 8px 10px; resize: vertical; }
  .field input.num { font-family: var(--mono); }
  .field input:focus, .field select:focus, .field textarea:focus, .search:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .field.bool { flex-direction: row; align-items: center; gap: 8px; }
  .field.bool label { font-size: 14px; color: var(--ink); }
  .field.bool input { width: 18px; height: 18px; }
  .actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .actions .btn.primary { flex-grow: 1; height: 44px; }
  .actions .btn { height: 44px; }
  .sub { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .sub h4 { margin: 0; font-size: 14px; }
  .contact { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); }
  .contact small { display: block; color: var(--muted); }
  .contact button { border: none; background: transparent; color: var(--danger); font-weight: 600; height: 32px; }
  .contact-add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .contact-add input { height: 34px; padding: 0 8px; border: 1px solid var(--line2); background: var(--bg); min-width: 0; }
  .contact-add .btn { grid-column: span 2; height: 34px; }
  .placeholder { flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
  .err { color: var(--danger); font-size: 13px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; background: #262626; color: #fff; font-weight: 600; z-index: 10; max-width: 90vw; }
  #toast.bad { background: var(--danger); }

  @media (max-width: 900px) {
    .body { flex-direction: column; padding: 12px; }
    nav.side { width: 100%; flex-direction: row; overflow-x: auto; padding: 0; }
    nav.side button { border-left: none; border-bottom: 3px solid transparent; flex-shrink: 0; gap: 8px; }
    nav.side button.on { border-bottom-color: var(--accent); }
    aside.edit { width: 100%; }
    .search { width: 100%; }
  }
  @media (max-width: 700px) { .top { gap: 8px; padding: 0 10px; } .top button { padding: 0 8px; font-size: 13px; } }   /* telefon: ülariba mahub ära */
</style>
<script src="nav.js"></script>
</head>
<body>

<div id="login" class="login hidden">
  <form class="login-box" id="loginForm">
    <h1>TEL 2.0</h1>
    <p>Logi sisse oma e-posti ja parooliga.</p>
    <div class="field"><label for="email">Kasutajanimi või e-post</label><input type="text" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="pass">Parool</label><input type="password" id="pass" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit" id="loginBtn" style="height:44px">Logi sisse</button>
  </form>
</div>

<div id="app" class="app hidden">
  <div class="top">
    <a class="brand" href="index.html" title="Avaleht">TEL 2.0</a><nav class="tn" id="tn"></nav>
    <span class="who" id="who"></span>
    <button id="logout" type="button">Logi välja</button>
  </div>
  <div class="body">
    <nav class="side" id="nav" aria-label="Jaotised"></nav>
    <main class="list">
      <div class="toolbar">
        <h2 id="title"></h2>
        <input class="search" id="search" type="search" placeholder="Otsi" aria-label="Otsi">
        <label class="check"><input type="checkbox" id="showOff"> Näita ka mitteaktiivseid</label>
        <button class="btn primary" id="addBtn" type="button">Lisa uus</button>
      </div>
      <div class="note hidden" id="note"></div>
      <div class="tablewrap" id="table"></div>
    </main>
    <aside class="edit" id="edit"></aside>
  </div>
</div>

<div id="toast" class="hidden" role="status"></div>

<script>
// ---------------------------------------------------------------

// ---------------------------------------------------------------

      { k: 'maksetahtaeg_paevi', l: 'Maksetähtaeg, päeva', t: 'int', list: true, def: 14, req: true },
      { k: 'kmkr', l: 'KMKR nr', t: 'text' },
      { k: 'km_liik', l: 'Käibemaks arvel', t: 'select', opts: [['tavaline', 'Tavaline (Eesti)'], ['poordmaks', 'EL ettevõte, 0%'], ['eksport', 'Eksport, 0%']], def: 'tavaline' },
      { k: 'reg_kood', l: 'Registrikood', t: 'text' },
      { k: 'email', l: 'Üldine e-post', t: 'text' },

  },
  materjalid: {

    fields: [
      { k: 'nimetus', l: 'Nimetus', t: 'text', req: true, list: true },
      { k: 'analoogid', l: 'Analoogid (komaga eraldatud)', t: 'tags', list: true },
      { k: 'tihedus', l: 'Tihedus, kg/dm³', t: 'num', list: true, dec: 3 },

  table: 'pinnakatted', title: 'Pinnakatted', one: 'pinnakate', canInsert: true, order: 'nimetus',
  fields: [
    { k: 'nimetus', l: 'Nimetus', t: 'text', req: true, list: true },
    { k: 'tarnija', l: 'Tarnija', t: 'text', list: true },
    { k: 'email', l: 'E-post (tellimuste saatmiseks)', t: 'text', list: true },
    { k: 'varu_paevi', l: 'Varu, tööpäeva (eeldatav valmimine)', t: 'int', list: true, def: 5 },
    { k: 'markused', l: 'Märkused', t: 'area', list: true },
    { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
  ]
};
ENT.tarnijad = {
  table: 'tarnijad', title: 'Tarnijad', one: 'tarnija', canInsert: true, order: 'nimi',
  fields: [
    { k: 'nimi', l: 'Nimi', t: 'text', req: true, list: true },
    { k: 'liik', l: 'Liik', t: 'select', opts: [['pinnakate', 'Pinnakate'], ['allhange', 'Allhange'], ['materjal', 'Materjal'], ['muu', 'Muu']], def: 'muu', list: true },
    { k: 'grupp', l: 'Grupp (allhanke mehed TR / FR)', t: 'select', opts: [['', '–'], ['TR', 'TR'], ['FR', 'FR']], def: '', list: true },
    { k: 'email', l: 'E-post (tellimused)', t: 'text', list: true },
    { k: 'aadress', l: 'Aadress', t: 'text' },
    { k: 'kontakt', l: 'Kontaktisik', t: 'text', list: true },
    { k: 'telefon', l: 'Telefon', t: 'text' },
    { k: 'markused', l: 'Märkused', t: 'area' },
    { k: 'aktiivne', l: 'Aktiivne', t: 'bool', def: true }
  ]
};
ENT.km = {
  table: 'km_maarad', title: 'Käibemaks', one: 'käibemaksumäär', canInsert: true, order: 'kehtib_alates', noActive: true,
  note: 'Uus määr kehtib alates valitud kuupäevast. Olemasolevad ostutellimused ja arved jäävad oma loomisel kehtinud määraga.',
  fields: [
    { k: 'maar', l: 'Määr, %', t: 'num', req: true, list: true, dec: 0 },

    { k: 'markus', l: 'Märkus', t: 'text', list: true }
  ]
};

ENT.seisakud = {
  table: 'pinkide_seisakud', title: 'Pinkide seisakud', one: 'seisak', canInsert: true, order: 'algus', desc: true, noActive: true, canDelete: true,
  note: 'Plaaniline hooldus, remont või rike. Seisaku päevadel selle pingi töid ei planeerita – mees teeb vahepeal teisi töid. Lõpp tühi = lõpp teadmata (plaan arvestab kuni tänaseni). Töömees saab rikke ise märkida ja "Pink töötab" nupuga lõpetada.',
  label: (r) => pinkName(r.pink_id) + ' ' + (r.algus || '').split('-').reverse().join('.'),
  count: (q) => q.is('lopetatud', null).or('lopp.is.null,lopp.gte.' + todayIso()),

    { k: 'algus', l: 'Algus', t: 'date', req: true, list: true, def: () => todayIso() },

let PINGID = [];
function todayIso() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

const NAV = ['kasutajad', 'kliendid', 'tarnijad', 'pingid', 'seisakud', 'materjalid', 'pinnakatted', 'km'];
const S = { tab: 'kliendid', rows: [], counts: {}, sel: null, isNew: false, q: '', showOff: false, contacts: [] };
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = (v, dec = 2) => v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('et-EE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const nameKey = (e) => e.fields[0].k;

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg; t.className = bad ? 'bad' : '';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = 'hidden', 3500);
}
function errText(err) {
  if (!err) return 'Tundmatu viga.';
  if (err.code === '23505') return 'Selle nimega kirje on juba olemas.';
  if (err.code === '42501') return 'Sul pole selleks õigusi.';
  if (err.code === '23503') return 'Kirjet kasutatakse mujal, seda ei saa kustutada. Märgi see mitteaktiivseks.';
  return err.message || String(err);
}

// ---------------------------------------------------------------
// Sisselogimine
// ---------------------------------------------------------------
async function start() {
  const { data } = await sb.auth.getSession();
  if (data.session) await enter(data.session.user); else showLogin();
}
function showLogin(msg) {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  $('loginErr').textContent = msg || '';
}
// sisselogimine kasutajanimega: "mart" -> mart@tel.hecada.com (e-posti aadressiga sisselogimine töötab edasi)
const loginEmail = (v) => { v = String(v || '').trim().toLowerCase(); return v.includes('@') ? v : v + '@tel.hecada.com'; };
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: loginEmail($('email').value), password: $('pass').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Vale e-post või parool.'; return; }
  await enter(data.user);
});
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

async function enter(user) {
  const { data: me, error } = await sb.from('profiilid').select('nimi, roll, aktiivne').eq('id', user.id).single();
  if (error || !me) { await sb.auth.signOut(); return showLogin('Kasutaja profiili ei leitud.'); }
  if (me.roll !== 'admin' || !me.aktiivne) { await sb.auth.signOut(); return showLogin('Admini paneel on ainult admin-rolliga kasutajatele.'); }
  $('who').textContent = me.nimi; TelNav.roll(me.roll);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  await loadCounts();
  await openTab(S.tab);
}

// ---------------------------------------------------------------
// Andmed
// ---------------------------------------------------------------
async function loadCounts() {
  await Promise.all(NAV.map(async (k) => {
    let q = sb.from(ENT[k].table).select('*', { count: 'exact', head: true });
    if (!ENT[k].noActive) q = q.eq('aktiivne', true);
    if (ENT[k].count) q = ENT[k].count(q);
    const { count } = await q;
    S.counts[k] = count ?? 0;
  }));
  renderNav();
}
async function openTab(tab) {
  S.tab = tab; S.sel = null; S.isNew = false; S.q = ''; $('search').value = '';
  renderNav();
  renderEdit();
  $('table').innerHTML = '<div class="empty">Laen…</div>';
  await loadRows();
}
async function loadRows() {
  const e = ENT[S.tab];
  if (S.tab === 'seisakud') {
    const { data: p } = await sb.from('pingid').select('id,nimi,aktiivne').order('nimi');
    PINGID = p || []; e.fields.find((f) => f.k === 'pink_id').opts = [['', 'Vali pink…']].concat(PINGID.map((x) => [x.id, x.nimi + (x.aktiivne ? '' : ' (mitteaktiivne)')]));
  }
  const { data, error } = await sb.from(e.table).select('*').order(e.order, { ascending: !e.desc });
  if (error) { $('table').innerHTML = '<div class="empty">' + esc(errText(error)) + '</div>'; return; }
  S.rows = data || [];
  renderList();
}
async function loadContacts(klientId) {
  const { data, error } = await sb.from('kontaktid').select('*').eq('klient_id', klientId).order('nimi');
  S.contacts = error ? [] : data;
}

// ---------------------------------------------------------------
// Kuvamine
// ---------------------------------------------------------------
function renderNav() {
  $('nav').innerHTML = NAV.map((k) =>
    '<button type="button" data-tab="' + k + '" class="' + (k === S.tab ? 'on' : '') + '">' +
    esc(ENT[k].title) + '<span class="n">' + (S.counts[k] ?? '') + '</span></button>').join('');
  const e = ENT[S.tab];
  $('title').textContent = e.title;
  $('addBtn').classList.toggle('hidden', !e.canInsert);
  $('note').classList.toggle('hidden', !e.note);
  $('note').textContent = e.note || '';
  const so = $('showOff').parentElement; so.lastChild.textContent = S.tab === 'seisakud' ? ' Näita ka lõppenud' : ' Näita ka mitteaktiivseid';
  so.classList.toggle('hidden', !!e.noActive && S.tab !== 'seisakud');
}
$('nav').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-tab]'); if (b) openTab(b.dataset.tab); });
$('search').addEventListener('input', (ev) => { S.q = ev.target.value.trim().toLowerCase(); renderList(); });
$('showOff').addEventListener('change', (ev) => { S.showOff = ev.target.checked; renderList(); });
$('addBtn').addEventListener('click', () => { S.sel = null; S.isNew = true; S.contacts = []; renderList(); renderEdit(); });

function cellHtml(f, v) {
  if (f.t === 'bool') return v ? 'Jah' : '–';
  if (f.t === 'select') { const o = (f.opts || []).find((x) => String(x[0]) === String(v)); return f.num ? esc(o ? o[1] : v) : '<span class="tag ' + esc(v) + '">' + esc(o ? o[1] : v) + '</span>'; }
  if (f.t === 'ts') return v ? esc(new Date(v).toLocaleString('et-EE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })) : '';
  if (f.t === 'num') return esc(fmtNum(v, f.dec || 2));
  if (f.t === 'tags') return esc((v || []).join(', '));
  if (f.t === 'date') return v ? esc(v.split('-').reverse().join('.')) : '';
  return esc(v);
}
const rowOff = (e, r) => e.noActive ? (S.tab === 'seisakud' && !!(r.lopetatud || (r.lopp && r.lopp < todayIso()))) : !r.aktiivne;
function renderList() {
  const e = ENT[S.tab];
  const cols = e.fields.filter((f) => f.list);
  let rows = S.rows.filter((r) => e.noActive || S.showOff || r.aktiivne);
  if (S.tab === 'seisakud' && !S.showOff) { const T = todayIso(); rows = rows.filter((r) => !r.lopetatud && (!r.lopp || r.lopp >= T)); }
  if (S.q) rows = rows.filter((r) => cols.some((f) => String(r[f.k] ?? '').toLowerCase().includes(S.q)));
  if (!rows.length) {
    $('table').innerHTML = '<div class="empty">' + (S.rows.length ? 'Otsingule vastavaid kirjeid pole.' : (e.canInsert ? 'Siin pole veel midagi. Vajuta "Lisa uus".' : 'Kasutajaid pole veel.')) + '</div>';
    return;
  }
  const head = '<tr>' + cols.map((f) => '<th' + (f.t === 'num' || f.t === 'int' ? ' style="text-align:right"' : '') + '>' + esc(f.l) + '</th>').join('') + '</tr>';
  const body = rows.map((r) => '<tr class="row' + (S.sel && S.sel.id === r.id ? ' sel' : '') + (rowOff(e, r) ? ' off' : '') + '" data-id="' + esc(r.id) + '">' +
    cols.map((f, i) => i === 0
      ? '<td><button type="button" class="rowbtn" data-id="' + esc(r.id) + '">' + (f.t === 'text' ? esc(r[f.k]) : cellHtml(f, r[f.k])) + '</button></td>'
      : '<td class="' + (f.t === 'num' || f.t === 'int' ? 'num' : '') + '"><div class="cell">' + cellHtml(f, r[f.k]) + '</div></td>').join('') + '</tr>').join('');
  $('table').innerHTML = '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
}
$('table').addEventListener('click', async (ev) => {
  const tr = ev.target.closest('[data-id]'); if (!tr) return;
  const r = S.rows.find((x) => String(x.id) === tr.dataset.id); if (!r) return;
  S.sel = r; S.isNew = false; S.contacts = [];
  if (ENT[S.tab].contacts) await loadContacts(r.id);
  renderList(); renderEdit();
});

function fieldHtml(f, v) {
  const id = 'f_' + f.k;
  const req = f.req ? ' required' : '';
  if (f.t === 'bool') return '<div class="field bool"><input type="checkbox" id="' + id + '"' + (v ? ' checked' : '') + '><label for="' + id + '">' + esc(f.l) + '</label></div>';
  let input;
  if (f.t === 'select') input = '<select id="' + id + '">' + f.opts.map((o) => '<option value="' + o[0] + '"' + (String(o[0]) === String(v ?? '') ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  else if (f.t === 'ts') input = '<div style="height:38px;display:flex;align-items:center;color:var(--muted)">' + (v ? cellHtml(f, v) : '– (seisab)') + '</div>';
  else if (f.t === 'date') input = '<input type="date" id="' + id + '" value="' + esc(v || '') + '"' + req + ' style="height:38px;border:1px solid var(--line2);background:var(--bg);padding:0 10px;width:100%">';
  else if (f.t === 'tags') input = '<input type="text" id="' + id + '" value="' + esc((v || []).join(', ')) + '" placeholder="nt 1.0570, St52-3">';
  else if (f.t === 'area') input = '<textarea id="' + id + '">' + esc(v) + '</textarea>';
  else if (f.t === 'num' || f.t === 'int') input = '<input type="text" inputmode="decimal" class="num" id="' + id + '" value="' + esc(v === null || v === undefined ? '' : String(v).replace('.', ',')) + '"' + req + '>';
  else input = '<input type="text" id="' + id + '" value="' + esc(v) + '"' + req + '>';
  return '<div class="field"><label for="' + id + '">' + esc(f.l) + (f.req ? ' *' : '') + '</label>' + input + '</div>';
}
function renderEdit() {
  const e = ENT[S.tab];
  const box = $('edit');
  if (!S.sel && !S.isNew) {
    box.innerHTML = '<div class="placeholder">Vali vasakult tabelist kirje, et seda muuta' + (e.canInsert ? ', või lisa uus.' : '.') + '</div>';
    return;
  }
  const r = S.sel || {};
  const val = (f) => S.isNew ? ((typeof f.def === 'function' ? f.def() : f.def) ?? (f.t === 'bool' ? false : f.t === 'tags' ? [] : '')) : r[f.k];
  let html = '<header><h3>' + (S.isNew ? 'Uus ' + esc(e.one) : esc(e.label ? e.label(r) : r[nameKey(e)])) + '</h3></header>';
  html += '<form class="form" id="editForm" novalidate>' + e.fields.map((f) => fieldHtml(f, val(f))).join('');
  if (e.contacts && !S.isNew) {
    html += '<div class="sub"><h4>Ostjad (kontaktid)</h4>' +
      (S.contacts.length ? S.contacts.map((c) => '<div class="contact"><div>' + esc(c.nimi) + '<small>' + esc([c.email, c.telefon].filter(Boolean).join(', ')) + '</small></div><button type="button" data-delc="' + c.id + '">Eemalda</button></div>').join('') : '<span style="color:var(--muted)">Ostjaid pole lisatud.</span>') +
      '<div class="contact-add"><input id="c_nimi" placeholder="Nimi" aria-label="Ostja nimi"><input id="c_tel" placeholder="Telefon" aria-label="Ostja telefon"><input id="c_email" placeholder="E-post" aria-label="Ostja e-post" style="grid-column:span 2"><button type="button" class="btn" id="addContact">Lisa ostja</button></div></div>';
  }
  html += '<div class="err" id="formErr"></div></form>';
  html += '<div class="actions"><button class="btn primary" type="button" id="saveBtn">Salvesta</button><button class="btn" type="button" id="cancelBtn">Tühista</button>' +
    (e.canDelete && !S.isNew ? '<button class="btn" type="button" id="delBtn" style="margin-left:auto;color:var(--danger)">Kustuta</button>' : '') + '</div>';
  box.innerHTML = html;
  $('saveBtn').addEventListener('click', save);
  $('cancelBtn').addEventListener('click', () => { S.sel = null; S.isNew = false; renderList(); renderEdit(); });
  if ($('delBtn')) $('delBtn').addEventListener('click', delRow);
  if (e.contacts && !S.isNew) {
    $('addContact').addEventListener('click', addContact);
    box.querySelectorAll('[data-delc]').forEach((b) => b.addEventListener('click', () => delContact(b.dataset.delc)));
  }
}

// ---------------------------------------------------------------
// Salvestamine
// ---------------------------------------------------------------
function readForm(e) {
  const out = {}; const errs = [];
  e.fields.forEach((f) => {
    if (f.ro) return;
    const el = $('f_' + f.k);
    if (f.t === 'bool') { out[f.k] = el.checked; return; }
    let v = el.value.trim();
    if (f.t === 'tags') { out[f.k] = v ? [...new Set(v.split(/[,;]/).map((x) => x.trim()).filter(Boolean))] : []; return; }
    if (f.t === 'num' || f.t === 'int') {
      if (v === '') v = null;
      else {
        const n = Number(v.replace(/\s/g, '').replace(',', '.'));
        if (Number.isNaN(n)) { errs.push(f.l + ': peab olema number.'); return; }
        v = f.t === 'int' ? Math.round(n) : n;
      }
    } else if (v === '') v = null;
    if (f.num && v !== null) v = Number(v);
    if (f.req && (v === null || v === '')) errs.push(f.l + ' on kohustuslik.');
    out[f.k] = v;
  });
  return { out, errs };
}
async function save() {
  const e = ENT[S.tab];
  const { out, errs } = readForm(e);
  if (errs.length) { $('formErr').textContent = errs.join(' '); return; }
  $('saveBtn').disabled = true;
  const q = S.isNew ? sb.from(e.table).insert(out) : sb.from(e.table).update(out).eq('id', S.sel.id);
  const { data, error } = await q.select().single();
  $('saveBtn').disabled = false;
  if (error) { $('formErr').textContent = errText(error); return; }
  toast(S.isNew ? 'Lisatud: ' + (e.label ? e.label(data) : data[nameKey(e)]) : 'Salvestatud');
  S.isNew = false; S.sel = data;
  await loadRows();
  S.sel = S.rows.find((x) => x.id === data.id) || data;
  if (e.contacts) await loadContacts(data.id);
  renderList(); renderEdit(); loadCounts();
}
async function delRow() {
  const e = ENT[S.tab]; if (!S.sel) return;
  if (!confirm('Kustutan: ' + (e.label ? e.label(S.sel) : S.sel[nameKey(e)]) + '?')) return;
  const { error } = await sb.from(e.table).delete().eq('id', S.sel.id);
  if (error) { toast(errText(error), true); return; }
  toast('Kustutatud'); S.sel = null; await loadRows(); renderEdit(); loadCounts();
}
async function addContact() {
  const nimi = $('c_nimi').value.trim();
  if (!nimi) { $('formErr').textContent = 'Ostja nimi on kohustuslik.'; return; }
  const { error } = await sb.from('kontaktid').insert({ klient_id: S.sel.id, nimi, telefon: $('c_tel').value.trim() || null, email: $('c_email').value.trim() || null });
  if (error) { $('formErr').textContent = errText(error); return; }
  toast('Ostja lisatud');
  await loadContacts(S.sel.id); renderEdit();
}
async function delContact(id) {
  const c = S.contacts.find((x) => String(x.id) === String(id));
  if (!confirm('Eemaldada ostja ' + (c ? c.nimi : '') + '?')) return;
  const { error } = await sb.from('kontaktid').delete().eq('id', id);
  if (error) { toast(errText(error), true); return; }
  toast('Ostja eemaldatud');
  await loadContacts(S.sel.id); renderEdit();
}

start();
</script>
</body>
</html>
