<!doctype html>
<html lang="et">
<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
  :root { --bg: #F4F4F4; --panel: #FFFFFF; --ink: #161616; --muted: #525252; --line: #E0E0E0; --line2: #C6C6C6;
    --accent: #0F62FE; --late: #DA1E28; --done: #198038; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); font-size: 14px; background-color: var(--bg);
    background-image: linear-gradient(#E6E6E6 1px, transparent 1px), linear-gradient(90deg, #E6E6E6 1px, transparent 1px); background-size: 16px 16px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login form { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .login h1 { margin: 0; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select { width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--line2); border-bottom-color: #8D8D8D; background: var(--bg); }
  .primary { height: 40px; padding: 0 16px; border: none; background: var(--accent); color: #fff; font-weight: 700; }
  .primary:disabled, .btn:disabled { opacity: .5; }
  .btn { height: 36px; padding: 0 14px; border: 1px solid var(--line2); background: var(--panel); font-weight: 600; }
  .btn:hover { border-color: var(--ink); }
  .btn.green { color: var(--done); border-color: var(--done); }
  .err { color: var(--late); font-size: 13px; min-height: 16px; }
  .top { height: 52px; display: flex; align-items: center; gap: 20px; padding: 0 20px; background: #161616; color: #F4F4F4; }
  .top .brand { font-family: var(--mono); font-weight: 600; font-size: 16px; }
  .top .sp { flex-grow: 1; }
  .top button { background: transparent; border: 1px solid #6F6F6F; color: #F4F4F4; height: 32px; padding: 0 12px; }
  .wrap { padding: 16px 20px 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar h2 { margin: 0; font-size: 18px; }
  .bar .sp { flex-grow: 1; }
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--line); }
  .seg button { height: 30px; padding: 0 12px; border: none; background: transparent; font-weight: 600; font-size: 13px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .search { height: 34px; width: 300px; padding: 0 10px; border: 1px solid var(--line2); background: var(--bg); }
  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  table.list { min-width: 900px; }
  th { background: var(--line); text-align: left; font-size: 12px; font-weight: 600; padding: 7px 8px; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.list td { white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }   /* read ühe rea kõrgused, laiem tabel kerib (.tw) */
  th.r, td.r { text-align: right; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #EDF5FF; }
  .mono { font-family: var(--mono); }
  .tag { display: inline-block; padding: 1px 8px; font-size: 12px; font-weight: 600; border: 1px solid; }
  .o-koostamisel { color: #393939; background: #F4F4F4; border-color: #8D8D8D; }
  .o-valjastatud { color: #0043CE; background: #D0E2FF; border-color: #0043CE; }
  .o-makstud { color: #0E6027; background: #DEFBE6; border-color: #0E6027; }
  .o-yletatud { color: #fff; background: var(--late); border-color: var(--late); }
  .o-osaliselt { color: #6B5000; background: #FCF4D6; border-color: #B28600; }
  .o-tuhistatud { color: #6F6F6F; background: #fff; border-color: #C6C6C6; text-decoration: line-through; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--line2); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  button.kpi:hover { background: #FAFAFA; }
  .kpi small { color: var(--muted); font-size: 12px; } .kpi b { font-family: var(--mono); font-size: 22px; font-weight: 600; } .kpi span { font-size: 12px; color: var(--muted); }
  .kpi.late { border-top-color: var(--late); } .kpi.late b { color: var(--late); } .kpi.open { border-top-color: var(--accent); } .kpi.paid { border-top-color: var(--done); }
  table.rows input.t { width: 100%; text-align: left; font-family: inherit; }
  table.rows input.u { width: 56px; text-align: left; font-family: inherit; }
  .totals { margin-left: auto; display: grid; grid-template-columns: auto 120px; gap: 4px 18px; text-align: right; font-size: 14px; }
  .totals b { font-family: var(--mono); }
  @media (max-width: 800px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .head { display: grid; grid-template-columns: 1.4fr 1fr 1fr 0.6fr; gap: 12px; padding: 14px; background: #FAFAFA; border-bottom: 1px solid var(--line); }
  .head .full { grid-column: 1 / -1; }
  table.rows { min-width: 900px; }
  table.rows td { vertical-align: middle; }
  table.rows input { width: 90px; height: 32px; border: 1px solid var(--line2); background: #fff; padding: 0 6px; font-family: var(--mono); text-align: right; }
  table.rows input.over { border-color: var(--late); background: #FFF1F1; }
  table.rows img { width: 52px; height: 38px; object-fit: contain; border: 1px solid var(--line2); background: #fff; display: block; }
  .x { border: none; background: transparent; color: var(--late); font-size: 18px; width: 30px; height: 32px; }
  .foot { display: flex; gap: 10px; align-items: center; padding: 12px 14px; flex-wrap: wrap; }
  .foot .sum { margin-left: auto; font-family: var(--mono); font-weight: 700; }
  .lock { padding: 10px 14px; background: #DEFBE6; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal { width: 100%; max-width: 860px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: #fff; border: 1px solid var(--ink); }
  .modal header { background: #161616; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
  .modal header button { background: transparent; border: none; color: #fff; font-size: 22px; width: 32px; height: 32px; }
  .modal .mb { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; min-height: 0; flex-grow: 1; }
  .modal .ft { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .modal .ft button { height: 44px; padding: 0 16px; border: 1px solid var(--line2); background: #fff; font-weight: 600; }
  .modal .ft .primary { flex-grow: 1; border: none; background: var(--accent); color: #fff; }
  .pick { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pick td, .pick th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .pick th { background: var(--line); position: sticky; top: 0; }
  .pick tr.off td { color: #8D8D8D; }
  .pick input[type=checkbox] { width: 18px; height: 18px; }
  .pick input.q { width: 70px; height: 30px; border: 1px solid var(--line2); font-family: var(--mono); text-align: right; padding: 0 6px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; background: #262626; color: #fff; font-weight: 600; z-index: 50; max-width: 92vw; }
  #toast.bad { background: var(--late); }
  @media (max-width: 800px) {
    body { background-image: none; } .wrap { padding: 12px; } .head { grid-template-columns: 1fr 1fr; } .search { width: 100%; }
    .modal-bg { padding: 0; align-items: stretch; } .modal { max-width: none; max-height: none; height: 100dvh; border: none; }
  }
  /* arvutis: tabel sisu laiune, mitte üle kogu ekraani (Raimo 23.09) */
  @media (min-width: 1100px) {
    table.list { width: auto; min-width: 640px; }
    table.list th, table.list td { padding-left: 10px; padding-right: 22px; white-space: nowrap; }
    table.list th:last-child, table.list td:last-child { padding-right: 12px; }
  }
  @media (max-width: 700px) { .top { gap: 8px; padding: 0 10px; } .top button { padding: 0 8px; font-size: 13px; } }   /* telefon: ülariba mahub ära */
</style>
<script src="nav.js"></script>
<script src="periood.js"></script>
</head>
<body>
<div class="login hidden" id="login">
  <form id="loginForm">
    <h1>TEL 2.0</h1>
    <div class="field"><label for="email">Kasutajanimi või e-post</label><input type="text" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="pass">Parool</label><input type="password" id="pass" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit">Logi sisse</button>
  </form>
</div>
<div class="hidden" id="app">
  <div class="top"><a class="brand" href="index.html" title="Avaleht">TEL 2.0</a><nav class="tn" id="tn"></nav><span class="sp"></span>
    <button type="button" id="logout">Logi välja</button></div>
  <div class="wrap"><div id="kpiBox"></div><div class="card" id="main"></div></div>
</div>
<div id="toast" class="hidden" role="status"></div>

<script>
const SUPABASE_URL = 'https://abbwugsoakvirqlmovzt.supabase.co';
const SUPABASE_KEY = 'sb_publishable__5gmN-qWgogdCAJ7GAZq0w_XBA93LKs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + (n || 0)); return iso(d); };
const dayDiff = (s) => Math.round((Date.parse(s) - Date.parse(today())) / 86400000);
const fd = (s) => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '';
const eur = (n) => (Number(n) || 0).toLocaleString('et-EE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const numIn = (v) => v === null || v === undefined ? '' : String(Number(v)).replace('.', ',');
const num = (v) => { const t = String(v ?? '').trim(); if (!t) return null; const n = Number(t.replace(/\s/g, '').replace(',', '.')); return Number.isNaN(n) ? undefined : n; };
const kog = (v) => { const n = Number(v || 0); return n % 1 ? String(n).replace('.', ',') : String(Math.round(n)); };
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = 'hidden'), 3800); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const KMR = { tavaline: 'Tavaline', poordmaks: 'EL ettevõte, 0%', eksport: 'Eksport, 0%' };
const ST = { koostamisel: 'Koostamisel', valjastatud: 'Tasumata', osaliselt: 'Osaliselt tasutud', yletatud: 'Tähtaeg ületatud', makstud: 'Makstud', tuhistatud: 'Tühistatud' };

const S = { me: null, kliendid: [], kontaktid: [], km: [], list: [], f: 'tasumata', q: '', a: null, removed: [] };
const canEdit = () => S.me.roll === 'admin';
const kmRate = (d) => { const r = S.km.filter((x) => x.kehtib_alates <= d).sort((a, b) => b.kehtib_alates.localeCompare(a.kehtib_alates))[0]; return r ? Number(r.maar) : 24; };
function state(a) {
  if (a.olek !== 'valjastatud') return a.olek;
  if (Number(a.tasutud) >= Number(a.summa) - 0.005) return 'makstud';
  if (a.maksetahtaeg && dayDiff(a.maksetahtaeg) < 0) return 'yletatud';
  return Number(a.tasutud) > 0 ? 'osaliselt' : 'valjastatud';
}

// ------------------------------------------------------------ sisselogimine
async function start() { const { data } = await sb.auth.getSession(); if (data.session) enter(data.session.user); else showLogin(); }
function showLogin(m) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginErr').textContent = m || ''; }
// sisselogimine kasutajanimega: "mart" -> mart@tel.hecada.com (e-posti aadressiga sisselogimine töötab edasi)
const loginEmail = (v) => { v = String(v || '').trim().toLowerCase(); return v.includes('@') ? v : v + '@tel.hecada.com'; };
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const { data, error } = await sb.auth.signInWithPassword({ email: loginEmail($('email').value), password: $('pass').value });
  if (error) return ($('loginErr').textContent = 'Vale e-post või parool.');
  enter(data.user);
});
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });
async function enter(user) {
  const { data: me } = await sb.from('profiilid').select('id,nimi,roll,aktiivne').eq('id', user.id).single();
  if (!me || !me.aktiivne || !['admin', 'raamatupidaja'].includes(me.roll)) { await sb.auth.signOut(); return showLogin('Arved on kontori kasutajatele.'); }
  S.me = me; TelNav.roll(me.roll); $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  const [k, c, m] = await Promise.all([sb.from('kliendid').select('*').order('nimi'), sb.from('kontaktid').select('*').order('nimi'), sb.from('km_maarad').select('*')]);
  S.kliendid = k.data || []; S.kontaktid = c.data || []; S.km = m.data || [];
  const qs = new URLSearchParams(location.search);
  if (qs.get('sl') && canEdit()) return fromSl(Number(qs.get('sl')));
  if (qs.get('id')) openA(Number(qs.get('id'))); else loadList();
}
window.addEventListener('popstate', () => { const id = new URLSearchParams(location.search).get('id'); if (id) openA(Number(id), true); else loadList(true); });

// ------------------------------------------------------------ nimekiri
async function loadList(noPush) {
  S.a = null;
  if (!noPush && location.search) history.pushState(null, '', location.pathname);
  // kõik arved (koos Exceli ajalooga ~5000), laetakse 1000 kaupa
  const data = [];
  for (let from = 0; ; from += 1000) {
    const { data: d, error } = await sb.from('arved').select('*, kliendid(nimi)').order('id', { ascending: false }).range(from, from + 999);
    if (error) { $('main').innerHTML = '<div class="empty">' + esc(error.message) + '</div>'; return; }
    data.push(...d); if (d.length < 1000) break;
  }
  S.list = data.map((a) => ({ ...a, st: state(a) })); renderList();
}
TelPer.init('arved', () => { if (S.me && !S.a) renderList(); });
function renderList() {
  const L = S.list;
  const open = L.filter((a) => ['valjastatud', 'osaliselt', 'yletatud'].includes(a.st)), late = L.filter((a) => a.st === 'yletatud');
  const mk = today().slice(0, 7), month = L.filter((a) => a.olek === 'valjastatud' && (a.kuupaev || '').startsWith(mk));
  const left = (a) => Number(a.summa) - Number(a.tasutud);
  const k = (cls, l, b, s, f) => '<button type="button" class="kpi ' + cls + '" data-kf="' + f + '"><small>' + l + '</small><b>' + b + '</b><span>' + s + '</span></button>';
  $('kpiBox').innerHTML = '<div class="kpis">' + k('open', 'Tasumata', eur(open.reduce((a, x) => a + left(x), 0)) + ' €', open.length + ' arvet', 'tasumata') +
    k('late', 'Tähtaeg ületatud', eur(late.reduce((a, x) => a + left(x), 0)) + ' €', late.length + ' arvet', 'yletatud') +
    k('', 'Selle kuu müük', eur(month.reduce((a, x) => a + Number(x.summa_neto), 0)) + ' €', 'ilma KM-ta, ' + month.length + ' arvet', 'koik') +
    k('paid', 'Koostamisel', L.filter((a) => a.st === 'koostamisel').length, 'arvet', 'koostamisel') + '</div>';
  $('kpiBox').onclick = (e) => { const b = e.target.closest('[data-kf]'); if (b) { S.f = b.dataset.kf; renderList(); } };
  const F = [['tasumata', 'Tasumata'], ['yletatud', 'Ületatud'], ['koostamisel', 'Koostamisel'], ['makstud', 'Makstud'], ['koik', 'Kõik']];
  let rows = L.filter((a) => S.f === 'koik' || (S.f === 'tasumata' ? ['valjastatud', 'osaliselt', 'yletatud'].includes(a.st) : a.st === S.f));
  if (S.q) rows = rows.filter((a) => [a.nr, a.kliendid?.nimi, a.viitenumber, a.markused].join(' ').toLowerCase().includes(S.q));
  rows = rows.filter((a) => TelPer.test('arved', a.kuupaev));
  $('main').innerHTML = '<div class="bar"><h2>Arved</h2><div class="seg" id="seg">' + F.map(([k2, l]) => '<button type="button" data-f="' + k2 + '" class="' + (S.f === k2 ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
    '<input class="search" id="q" type="search" placeholder="Otsi: nr, klient, viitenumber" value="' + esc(S.q) + '" aria-label="Otsi">' + TelPer.html('arved') + '<span class="sp"></span>' +
    (canEdit() ? '<button type="button" class="primary" id="newA">Uus arve</button>' : '') + '</div>' +
    (rows.length ? '<div class="tw"><table class="list"><thead><tr><th>Nr</th><th>Kuupäev</th><th>Klient</th><th class="r">Summa, €</th><th class="r">Tasutud, €</th><th>Maksetähtaeg</th><th class="r">Aega</th><th>Olek</th><th>Keel</th></tr></thead><tbody>' +
      rows.map((a) => '<tr class="row" data-id="' + a.id + '"><td class="mono" style="font-weight:600">' + esc(a.nr) + (a.allikas === 'excel' ? ' <small style="font-weight:400;color:var(--muted)">Excel</small>' : '') + '</td><td class="mono">' + fd(a.kuupaev) + '</td><td>' + esc(a.kliendid?.nimi || '') + '</td>' +
        '<td class="mono r" style="font-weight:600">' + eur(a.summa) + '</td><td class="mono r">' + eur(a.tasutud) + '</td><td class="mono">' + fd(a.maksetahtaeg) + '</td>' +
        '<td class="mono r" style="font-weight:600;color:' + (a.st === 'yletatud' ? 'var(--late)' : 'inherit') + '">' + (['valjastatud', 'osaliselt', 'yletatud'].includes(a.st) && a.maksetahtaeg ? dayDiff(a.maksetahtaeg) : '') + '</td>' +
        '<td><span class="tag o-' + a.st + '">' + ST[a.st] + '</span></td><td>' + (a.keel === 'en' ? 'EN' : 'ET') + '</td></tr>').join('') +
      '</tbody><tfoot><tr><td colspan="3" style="font-weight:700">' + rows.length + ' arvet</td><td class="mono r" style="font-weight:700">' + eur(rows.reduce((a, x) => a + Number(x.summa), 0)) + '</td><td class="mono r">' + eur(rows.reduce((a, x) => a + Number(x.tasutud), 0)) + '</td><td colspan="4"></td></tr></tfoot></table></div>'
    : '<div class="empty">' + (L.length ? 'Selles vaates arveid pole.' : 'Arveid pole veel.' + (canEdit() ? ' Vajuta "Uus arve" või ava väljastatud saateleht ja "Koosta arve".' : '')) + '</div>');
  $('seg').onclick = (e) => { const b = e.target.closest('[data-f]'); if (b) { S.f = b.dataset.f; renderList(); } };
  $('q').oninput = (e) => { S.q = e.target.value.trim().toLowerCase(); renderList(); const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); };
  $('main').querySelectorAll('tr.row').forEach((tr) => tr.onclick = () => openA(Number(tr.dataset.id)));
  if ($('newA')) $('newA').onclick = newA;
}

// ------------------------------------------------------------ uus arve
async function usedSlRows() {
  const { data } = await sb.from('arve_read').select('saatelehe_rida_id, arved!inner(olek)').not('saatelehe_rida_id', 'is', null).neq('arved.olek', 'tuhistatud');
  return new Set((data || []).map((x) => x.saatelehe_rida_id));
}
async function createFor(kid) {
  const k = S.kliendid.find((x) => x.id === kid) || {};
