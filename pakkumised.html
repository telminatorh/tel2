  • Nimekiri nagu tellimustel: otsing nr / kliendi / päringu / joonise nr järgi, staatus (aegunud = kehtivus läbi).
  • Vormistus: käsitsi, kleepides (Excelist: nimetus, kogus …), Exceli mallist (sama loogika mis tellimusel + rev, kogus 1–3,
    materjal, pinnakate), failid (PDF joonis / STEP mudel – valikuline; mitu faili korraga → seotakse nime järgi).
  • Kalkulatsioon: hind/tk = (seadistus + h/tk × kogus) × €/h ÷ kogus + (materjal + pinnakate + ost) × (1 + juurdehindlus %).
    Käsitsi muudetud hind jääb (kollane, ↺ = tagasi valemile). ≈ €/h = (hind − materjal − pinnakate − ost) × kogus ÷ oodatav
    TEGELIK aeg (detaili ajalugu, nagu tellimusel) või hinnatud aeg. Kuni 3 koguseastet (Raimo 05.11).
  • Ajalugu: read_ajalugu (TEL 2.0 + vana Excel) – mitu korda, mis kogustes, viimane hind/norm/pink; varasemad pakkumised.
  • Valmimine: pink (+ mees) → TelPlaan praeguse koormusega (sama mis Tarneaeg?), mees "Kiireim" = varaseim; midagi ei salvestata.
  • Eksport: Excel (kliendile / kalkulatsioon) ja PDF (et / en, Hecada päis – dokumendid.js).
  • Tee tellimuseks → tellimused.html?uus&pakkumine=ID (read sessionStorage'is; tellimuse redaktor arvutab normi ise;
    salvestamisel pakkumine = vastu võetud + seotud tellimusega).
====================================================================================== -->

const pad = (n) => (n < 10 ? '0' : '') + n;

const fmtNum = (v, dec = 2) => v === null || v === undefined || v === '' || Number.isNaN(Number(v)) ? '' : Number(v).toLocaleString('et-EE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtQ = (v) => v === null || v === undefined ? '' : String(Math.round(Number(v) * 100) / 100).replace('.', ',');

function stOk(p, f) { f = f || S.f; if (f === 'koik') return true; if (f === 'avatud') return p.st === 'mustand' || p.st === 'saadetud'; return p.st === f; }
function perRange() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  switch (S.per) {
    case 'm0': return [localIso(new Date(y, m, 1)), localIso(new Date(y, m + 1, 0))];
    case 'm1': return [localIso(new Date(y, m - 1, 1)), localIso(new Date(y, m, 0))];
    case 'd90': return [isoPlus(-90), today()];
    case 'y0': return [y + '-01-01', y + '-12-31'];

  }
}
function filtered() {

const histT = {};
async function loadHist(i) {

  r.hist = null; paintHint(i);

  if (Q !== q || Q.rows[i] !== r) return;

}
async function loadHistMany(onlyMissing) {
  const idx = Q.rows.map((r, i) => i).filter((i) => (Q.rows[i].nimetus || '').trim() && (!onlyMissing || !Array.isArray(Q.rows[i].hist)));
  if (!idx.length) return;
  const q = Q, rows = idx.map((i) => q.rows[i]);
  rows.forEach((r, j) => { r.hist = null; paintHint(idx[j]); });
  const names = [...new Set(rows.map((r) => lk(r.nimetus)))];
  const [h, p] = await Promise.all([histFetch(names), prevFetch(names)]);
  if (Q !== q) return;
  idx.forEach((i, j) => { const r = rows[j]; if (q.rows[i] !== r) return; r.hist = h.get(lk(r.nimetus)) || []; r.prev = p.get(lk(r.nimetus)) || []; paintHint(i); });
  qSum();
}

// ---------------- valmimine praeguse koormusega (sama loogika mis tellimuste "Tarneaeg?")
const planWorkers = () => L.profiilid.filter((x) => x.roll === 'toomees' && x.aktiivne && (S.PA ? S.PA.paev(x) > 0 : Number(x.nadala_norm) > 0));

function valmCalc() {

  if (!W.length) return { err: 'Ühelgi aktiivsel töömehel pole nädala normi – valmimist ei saa arvutada.', ah, miss };

  const o = { lvs: L.lvs, extra: L.ex, seisMap: TelPlaan.seisMap(L.seis, T), A: S.PA };
  const fake = (x, wid) => ({ id: -(x.i + 1), staatus: 'cam', nimetus: '\u0001pk ' + x.r.nimetus, kogus: x.q, norm: x.h, tahtaeg: Q.soovitud || null, pink_id: x.r.pink_id, teostaja_id: wid, pinnakate: x.r.pinnakate || null, jrk: null });
  const asg = new Map();
  const list = (wid) => active.filter((r) => r.teostaja_id === wid).concat(asg.get(wid) || []);
  own.forEach((x) => {
    let cand = x.r.teostaja_id ? W.filter((w) => w.id === x.r.teostaja_id) : null;
    if (x.r.teostaja_id && !cand.length) { miss.push(Object.assign(x, { why: 'mehel pole nädala normi' })); return; }
    if (!cand) { const ids = new Set(active.filter((r) => r.pink_id === x.r.pink_id).map((r) => r.teostaja_id)); cand = W.filter((w) => ids.has(w.id)); if (!cand.length) cand = W; }
    let best = null;
    cand.forEach((w) => { const f = fake(x, w.id); const P = TelPlaan.plan(w, list(w.id).concat([f]), o); const j = P.jobs.find((y) => y.r.id === f.id); if (j && j.fin && (!best || j.fin < best.fin)) best = { w, f, fin: j.fin }; });
    if (!best) { miss.push(x); return; }

  const hilja = (P) => { const s = new Set(); P.jobs.forEach((j) => { if (j.r.id > 0 && j.fin && j.r.tahtaeg && (j.r.pinnakate && varu(j.r.pinnakate) ? TelPlaan.addWorkdays(j.fin, varu(j.r.pinnakate)) : j.fin) > j.r.tahtaeg) s.add(j.r.id); }); return s; };

    const tbl = dd.content.find((c) => c.table && c.table.headerRows === 1);
    if (tbl) cells.forEach((c, k) => { if (!c) return; const r = c.r, row = tbl.table.body[k + 1];
      row[1] = { stack: [{ text: r.nimetus + (r.revisjon ? '  rev ' + r.revisjon : ''), bold: true }].concat(r.kirjeldus ? [{ text: r.kirjeldus, fontSize: 7.5, color: '#525252', margin: [0, 1, 0, 0] }] : []) }; });
    const blob = await new Promise((ok, bad) => { try { window.pdfMake.createPdf(dd).getBlob(ok); } catch (e) { bad(e); } });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = W.file + Q.nr + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    if (Q.staatus === 'mustand' && confirm('PDF valmis. Märgin pakkumise saadetuks?')) { Q.staatus = 'saadetud'; Q.saadetud = today(); const { error } = await sb.from('pakkumised').update({ staatus: 'saadetud', saadetud: Q.saadetud }).eq('id', Q.id); if (error) toast(errText(error), true); else qRender(); }
  } catch (e) { toast('PDF ebaõnnestus: ' + e.message, true); }
}

// ---------------- vastu võetud → tellimus (tellimuse redaktor; Raimo valis 05.11 „Mõlemad“: tellimuseks nüüd, statistika hiljem)
async function telDialog() {
  if (!(await needSaved())) return;
  if (!Q.klient_id) {
    if (!confirm('Klient "' + Q.klient_tekst + '" pole registris. Lisan kliendi registrisse (Kontor → Kliendid saab hiljem täiendada)?')) return;
    const ex = L.kliendid.find((k) => lk(k.nimi) === lk(Q.klient_tekst));
    let kid = ex && ex.id;
    if (!kid) { const { data, error } = await sb.from('kliendid').insert({ nimi: Q.klient_tekst, keel: Q.keel }).select('id,nimi,aadress,postiindeks,linn,riik,kmkr,keel,maksetahtaeg_paevi,aktiivne').single(); if (error) { toast(errText(error), true); return; } L.kliendid.push(data); kid = data.id; }
    const { error } = await sb.from('pakkumised').update({ klient_id: kid, klient_tekst: null }).eq('id', Q.id); if (error) { toast(errText(error), true); return; }
    Q.klient_id = kid; Q.klient_tekst = ''; Q.newKlient = false; qRender();
  }
  const rows = Q.rows.filter((r) => (r.nimetus || '').trim());
  const bg = document.createElement('div'); bg.className = 'tk-bg';
  bg.innerHTML = '<div class="tk" role="dialog" aria-modal="true"><div class="tk-h"><h3>Tee tellimuseks</h3><small>' + esc(Q.nr) + ' · vali kogus rea kaupa</small><button type="button" class="xbtn" data-x aria-label="Sulge">✕</button></div>' +
    '<div class="tk-b"><div class="field"><label for="tKt">Kliendi tellimuse nr</label><input type="text" id="tKt" value="' + esc(Q.kliendi_viide || '') + '"></div>' +
    '<div class="field"><label for="tTa">Tarneaeg</label><input type="date" id="tTa" value="' + esc(Q.soovitud || (S.valm && S.valm.valmib) || '') + '"></div><div>' +
    rows.map((r, i) => '<div class="tr-l"><input type="checkbox" data-on="' + i + '" checked aria-label="Kaasa"><span><b>' + esc(r.nimetus) + '</b>' + (r.revisjon ? ' rev ' + esc(r.revisjon) : '') + '<small>' + esc(r.allhange ? 'Allhange' : ((pinkOf(r) || {}).nimi || 'pink määramata')) + '</small></span><span class="opts">' +
      TIERS.filter((t) => tq(r, t)).map((t) => '<label><input type="radio" name="t' + i + '" value="' + t + '"' + (t === 1 ? ' checked' : '') + '>' + esc(fmtQ(tq(r, t))) + ' × ' + esc(fmtNum(r['hind' + t])) + '</label>').join('') + '</span></div>').join('') +
    '</div></div><div class="tk-f"><span>Avaneb tellimuse redaktor: norm arvutatakse nagu tellimusel, kontrolli ja vajuta Salvesta. Siis märgitakse pakkumine vastu võetuks.</span><button type="button" class="btn primary" data-go>Ava tellimusena →</button></div></div>';
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  bg.addEventListener('click', (e) => {
    if (e.target === bg || e.target.closest('[data-x]')) return close();
    if (!e.target.closest('[data-go]')) return;
    const sel = rows.map((r, i) => ({ r, i })).filter((x) => bg.querySelector('[data-on="' + x.i + '"]').checked);
    if (!sel.length) { toast('Vali vähemalt üks rida', true); return; }
    const out = sel.map(({ r, i }) => { const t = Number((bg.querySelector('input[name="t' + i + '"]:checked') || {}).value || 1);
      return { nimetus: r.nimetus, revisjon: r.revisjon || null, kogus: tq(r, t), uhik: r.uhik || 'tk', tk_hind: Number(r['hind' + t]) || 0, materjal_id: r.materjal_id, materjali_hind: r.materjali_hind,
        pink_id: r.allhange ? null : r.pink_id, allhange: !!r.allhange, tarnija_id: r.allhange ? r.tarnija_id : null, teostaja_id: r.allhange ? null : r.teostaja_id, pinnakate: r.pinnakate || null,
        ostuhind: (Number(r.pinnakatte_hind) || 0) + (Number(r.ost_hind) || 0) || null, markused: r.kirjeldus || null }; });
    const payload = { pk_id: Q.id, pk_nr: Q.nr, klient_id: Q.klient_id, kontakt_id: Q.kontakt_id, kliendi_tellimus: bg.querySelector('#tKt').value.trim(), tarneaeg: bg.querySelector('#tTa').value || null, rows: out, at: Date.now() };
    try { sessionStorage.setItem('tel2.pakkumine', JSON.stringify(payload)); } catch (er) { toast('Brauser ei luba andmeid edasi anda (privaatne aken?)', true); return; }
    location.href = 'tellimused.html?uus&pakkumine=' + Q.id;
  });
}

start();
