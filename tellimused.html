<style>
  :root { --bg: #F4F4F4; --panel: #FFFFFF; --ink: #161616; --muted: #525252; --line: #E0E0E0; --line2: #C6C6C6; --sel: #EDF5FF;
    --accent: #0F62FE; --accent-dark: #0043CE; --late: #DA1E28; --danger: #DA1E28; --today: #8E6A00; --done: #198038; --mono: 'IBM Plex Mono', ui-monospace, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); font-size: 14px; background-color: var(--bg);
    background-image: linear-gradient(#E6E6E6 1px, transparent 1px), linear-gradient(90deg, #E6E6E6 1px, transparent 1px); background-size: 16px 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login form { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; gap: 12px; }
  .login h1 { margin: 0; }
  .login .primary { height: 44px; border: none; background: var(--accent); color: #fff; font-weight: 700; }
  .err { color: var(--late); font-size: 13px; min-height: 16px; }

  .app { min-height: 100%; display: flex; flex-direction: column; }
  .top { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 20px; padding: 0 20px; background: #161616; color: #F4F4F4; }
  .top .brand { font-family: var(--mono); font-weight: 600; font-size: 16px; }
  .top .sp { flex-grow: 1; }
  .top small { color: #C6C6C6; }
  .top button { background: transparent; border: 1px solid #6F6F6F; color: #F4F4F4; height: 32px; padding: 0 12px; }
  .top button:hover { border-color: #F4F4F4; }

  .main { flex-grow: 1; display: flex; padding: 16px 20px 20px; min-height: 0; }
  .card { flex-grow: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar h2 { margin: 0 8px 0 0; font-size: 18px; }
  .fbar { display: flex; align-items: flex-end; gap: 10px; padding: 8px 12px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: #FAFAFA; }
  .fbar label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
  .fbar select, .fbar input { height: 34px; border: 1px solid var(--line2); background: #fff; padding: 0 8px; font-size: 13px; color: var(--ink); }
  .fbar .rng { display: flex; align-items: center; gap: 6px; }
  .fbar .clr { height: 34px; border: 1px solid transparent; background: transparent; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0 6px; }
  .fbar .clr:hover { text-decoration: underline; }
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--line); }
  .seg button { height: 30px; padding: 0 12px; border: none; background: transparent; font-weight: 600; font-size: 13px; white-space: nowrap; }
  .seg button.on { background: var(--ink); color: #fff; }
  .seg button small { font-family: var(--mono); font-weight: 400; opacity: .75; margin-left: 4px; }
  .search { height: 34px; width: 320px; padding: 0 10px; border: 1px solid var(--line2); background: var(--bg); }
  .search:focus, .fbar select:focus, .fbar input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  .btn { height: 34px; padding: 0 12px; border: 1px solid var(--line2); background: #fff; font-weight: 600; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.del { color: var(--red, #DA1E28); }
  .btn.del:hover { background: #FFF1F1; border-color: #DA1E28; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn:disabled { opacity: .5; cursor: default; }
  .push { margin-left: auto; }

  /* tellimuste nimekiri (nagu ülevaate tellimuste vaade) */
  #list { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .lh-row, .ord-h { display: grid; grid-template-columns: 96px minmax(160px, 1.4fr) minmax(90px, .8fr) 84px 110px 110px minmax(150px, 1fr) 64px; gap: 12px; align-items: center; padding: 8px 12px; }
  .lh-row { position: sticky; top: 0; z-index: 2; background: var(--line); font-size: 12px; font-weight: 600; padding-top: 6px; padding-bottom: 6px; }
  .lh-row button { all: unset; cursor: pointer; white-space: nowrap; }
  .lh-row button:focus-visible { outline: 2px solid var(--accent); }
  .ord { border-bottom: 1px solid var(--line); }
  .ord-h { cursor: pointer; }
  .ord-h:hover { background: #FAFAFA; }
  .ord-h:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ord.open .ord-h { background: var(--sel); }
  .ord.ready .ord-h { background: #DEFBE6; }
  .ord.shipped .ord-h { color: var(--muted); }
  .ord-h .open-b { height: 28px; padding: 0 10px; font-size: 12px; }
  .nr { font-family: var(--mono); font-weight: 600; }
  .cl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cl small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  small.pg { display: block; font-size: 11px; font-weight: 600; color: var(--done); } small.pg.late { color: var(--late); }
  .mono { font-family: var(--mono); }
  .r { text-align: right; }
  .pbw { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pbw small { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pb { flex-grow: 1; height: 10px; display: flex; background: #E0E0E0; min-width: 30px; }
  .pb i { display: block; height: 100%; }
  .rows { padding: 4px 12px 10px 120px; background: #FAFAFA; }
  .rw { display: grid; grid-template-columns: 56px minmax(160px, 1.4fr) 80px minmax(110px, 1fr) 70px 90px 100px 110px; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .rw:last-child { border-bottom: none; }
  .rw img, .rw .ph { width: 56px; height: 40px; object-fit: contain; background: #fff; border: 1px solid var(--line2); display: block; }
  .rw .ph { border-style: dashed; }
  .rw-more { padding: 8px 0 0; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; padding: 2px 8px; font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .s-cam { background: #FCF4D6; color: #6B5000; border-color: #B28600; }
  .s-toos { background: #D0E2FF; color: #0043CE; border-color: #0043CE; }
  .s-ok { background: #DEFBE6; color: #0E6027; border-color: #0E6027; }
  .s-pinnakattes, .s-allhankes { background: #E8DAFF; color: #6929C4; border-color: #6929C4; }
  .s-valmis { background: #24A148; color: #fff; border-color: #0E6027; }
  .foot { position: sticky; bottom: 0; display: flex; gap: 24px; padding: 8px 12px; border-top: 2px solid var(--ink); background: #F4F4F4; font-weight: 700; font-size: 13px; }
  .foot span { font-family: var(--mono); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  img.th { cursor: zoom-in; }
  #pv { position: fixed; z-index: 20; pointer-events: none; width: 440px; background: #fff; border: 1px solid var(--ink); box-shadow: 0 12px 32px rgba(0,0,0,.25); padding: 6px; }
  #pv img { width: 100%; display: block; }
  .lb { position: fixed; inset: 0; z-index: 35; background: rgba(22,22,22,.85); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 12px; }
  .lb img { max-width: min(1100px, 100%); max-height: calc(100dvh - 120px); background: #fff; }
  .lb .lbb { display: flex; gap: 8px; }
  .lb .lbb button { height: 44px; padding: 0 18px; border: 1px solid #fff; background: transparent; color: #fff; font-weight: 600; }
  .lb .lbb .pdf { background: var(--accent); border-color: var(--accent); }
  .lb .cap { color: #fff; font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 12px 18px; background: #262626; color: #fff; font-weight: 600; z-index: 40; max-width: 90vw; }
  #toast.bad { background: var(--late); }

  /* tellimuse sisestus / muutmine */
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input, .field select { height: 38px; padding: 0 10px; border: 1px solid var(--line2); border-bottom-color: #8D8D8D; background: var(--bg); width: 100%; }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  #ed { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; overflow: auto; }
  .ord-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ord-bar h3 { margin: 0; font-size: 18px; font-family: var(--mono); }
  .ord-bar .sum { margin-left: auto; font-family: var(--mono); color: var(--muted); }
  .ord-head { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 14px; border-bottom: 1px solid var(--line); background: #FAFAFA; }
  table.erows { width: 100%; border-collapse: collapse; min-width: 1180px; }
  table.erows th { position: sticky; top: 0; background: var(--line); text-align: left; font-size: 11px; font-weight: 600; padding: 6px; white-space: nowrap; }
  table.erows td { padding: 4px 3px; vertical-align: top; }
  table.erows tr.r td:first-child { padding-left: 10px; }
  table.erows input, table.erows select { width: 100%; height: 32px; padding: 0 6px; border: 1px solid var(--line2); background: #fff; min-width: 0; }
  table.erows input.num { font-family: var(--mono); text-align: right; }
  table.erows input.norm { background: #FCF4D6; }
  table.erows .nmw { display: flex; gap: 3px; }
  table.erows .nmw input.rev { width: 42px; flex: none; padding: 0 4px; font-size: 12px; color: var(--muted); }
  table.erows tr.h td { padding: 0 3px 8px 10px; border-bottom: 1px solid var(--line); }
  .hreal { color: var(--ink); } .hreal.over b { color: var(--late); }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .msb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  tr.h .msb input { width: 130px; height: 26px; border: 1px solid var(--line); background: transparent; font: inherit; font-size: 12px; padding: 0 4px; color: var(--muted); }
  .msb.on { color: #8E6A00; font-weight: 600; } tr.h .msb.on input { border-color: #F1C21B; background: #FFFBEB; color: var(--ink); }
  .hist { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 18px; }
  .hist b { color: var(--ink); font-weight: 600; }
  .hist button { border: 1px solid var(--accent); color: var(--accent); background: #fff; height: 24px; padding: 0 8px; font-size: 12px; font-weight: 600; }
  .hist.new { color: #0E6027; }
  .xbtn { border: none; background: transparent; color: var(--danger); font-size: 18px; height: 32px; width: 32px; }

  @media (min-width: 1101px) {
    html, body { height: 100%; overflow: hidden; }
    .app { height: 100vh; min-height: 0; }
    .main { min-height: 0; padding: 10px 20px 14px; }
    .card { min-height: 0; max-height: 100%; }
  }
  @media (max-width: 1100px) {
    .lh-row { display: none; }
    .ord-h { grid-template-columns: 84px minmax(0, 1fr) 70px 90px 64px; row-gap: 4px; }
    .ord-h .c-ost, .ord-h .c-loodud { display: none; }
    .ord-h .pbw { grid-column: 2 / 5; }
    .rows { padding-left: 12px; overflow-x: auto; } .rw { min-width: 720px; }
    .ord-head { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 700px) {
    body { background-image: none; }
    .top { gap: 8px; padding: 0 10px; height: 50px; }
    .top button { padding: 0 8px; font-size: 13px; }
    .top small { display: none; }
    .main { padding: 10px; }
    .bar h2 { width: 100%; }
    .seg { width: 100%; overflow-x: auto; }
    .search { width: 100%; }
    .fbar label { flex: 1 1 140px; }
    .ord-h { grid-template-columns: 74px minmax(0, 1fr) 92px; gap: 6px; font-size: 13px; }
    .ord-h .nr { font-size: 12px; }
    .ord-h .c-sum, .ord-h .open-b { display: none; }
    .ord-h .pbw { grid-column: 1 / -1; }
    .foot { flex-wrap: wrap; gap: 8px 16px; }
  }
  /* arvutis: nimekiri sisu laiune, mitte üle kogu ekraani (Raimo 23.09) */
  @media (min-width: 1101px) {
    .lh-row, .ord-h { grid-template-columns: 96px 190px 120px 84px 96px 100px 150px 64px; justify-content: start; }
    .lh-row, .ord, .foot { width: 1030px; max-width: 100%; }
    .rows { padding: 4px 12px 10px 120px; }
    .rw { grid-template-columns: 56px 190px 72px 150px 64px 80px 96px 100px; justify-content: start; }
    .card { align-items: stretch; }
  }
</style>
</head>
<body>
<div class="login hidden" id="login">
  <form id="loginForm">
    <h1>TEL 2.0</h1>
    <div class="field"><label for="email">Kasutajanimi või e-post</label><input type="text" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
    <div class="field"><label for="pass">Parool</label><input type="password" id="pass" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="primary" type="submit">Logi sisse</button>
  </form>
</div>

<div class="app hidden" id="app">
  <div class="top">
    <a class="brand" href="index.html" title="Avaleht">TEL 2.0</a><nav class="tn" id="tn"></nav>
    <span class="sp"></span><small id="upd"></small>
    <button type="button" id="refresh">Värskenda</button>
    <button type="button" id="logout">Logi välja</button>
  </div>
  <div class="main">
    <section class="card">
      <div id="lv">
        <div class="bar">
          <h2>Tellimused</h2>
          <div class="seg" id="seg"></div>
          <input class="search" id="q" type="search" placeholder="Otsi: tellimus, kliendi tellimus, joonise nr, klient, ostja" aria-label="Otsi">
          <button type="button" class="btn primary push" id="newBtn">+ Uus tellimus</button>
        </div>
        <div class="fbar">
          <label>Klient<select id="fKlient"><option value="">Kõik kliendid</option></select></label>
          <label>Kuupäev<select id="fDk"><option value="loodud">Tellimuse kuupäev</option><option value="tarneaeg">Tarneaeg</option></select></label>
          <label>Periood<select id="fPer">
            <option value="">Kogu aeg</option><option value="t0">Täna</option><option value="w0">See nädal</option><option value="w1">Järgmine nädal</option>
            <option value="m0">See kuu</option><option value="m1">Eelmine kuu</option><option value="d30">Viimased 30 päeva</option><option value="d90">Viimased 90 päeva</option>
            <option value="y0">See aasta</option><option value="y1">Eelmine aasta</option><option value="range">Vahemik…</option>
          </select></label>
          <label>Alates – kuni<span class="rng"><input type="date" id="fFrom" aria-label="Alates"><span>–</span><input type="date" id="fTo" aria-label="Kuni"></span></label>
          <button type="button" class="clr" id="fClr">Tühjenda filtrid</button>
        </div>
      </div>
      <div id="list"></div>
      <div id="ed" class="hidden"></div>
    </section>
  </div>
</div>
<div id="toast" class="hidden" role="status"></div>
<div id="pv" class="hidden" aria-hidden="true"><img alt=""></div>

<script>
const SUPABASE_URL = 'https://abbwugsoakvirqlmovzt.supabase.co';
const SUPABASE_KEY = 'sb_publishable__5gmN-qWgogdCAJ7GAZq0w_XBA93LKs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const localIso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => localIso(new Date());
const dayDiff = (iso) => Math.round((Date.parse(iso) - Date.parse(today())) / 86400000);
const fmtDate = (d) => d ? d.slice(0, 10).split('-').reverse().join('.') : '';
const fmtNum = (v, dec = 2) => v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('et-EE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const eur = (n, d = 0) => (n || 0).toLocaleString('et-EE', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const LBL = { cam: 'CAM teha', toos: 'Töös', ok: 'OK', pinnakattes: 'Pinnakattes', allhankes: 'Allhankes', valmis: 'Valmis' };
const canEdit = () => S.me && S.me.roll === 'admin';

// filtrid jäävad meelde (ainult selles brauseris)
const PREF_KEY = 'tel2.tellimused.filtrid';
const S = { me: null, orders: [], urls: {}, open: new Set(), f: 'pooleli', q: '', klient: '', dk: 'loodud', per: '', from: '', to: '', sort: { k: 'nr', dir: -1 } };
try { Object.assign(S, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { /* pole oluline */ }
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify({ f: S.f, klient: S.klient, dk: S.dk, per: S.per, from: S.from, to: S.to, sort: S.sort })); } catch (e) { /* pole oluline */ } }

function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = 'hidden'), 3500); }
function errText(err) {
  if (!err) return 'Tundmatu viga.';
  if (err.code === '23505') return 'Selline kirje on juba olemas.';
  if (err.code === '42501') return 'Sul pole selleks õigusi.';
  if (err.code === '23503') return 'Kirjet kasutatakse mujal, seda ei saa kustutada.';
  return err.message || String(err);
}

// ------------------------------------------------------------ sisselogimine
async function start() { const { data } = await sb.auth.getSession(); if (data.session) enter(data.session.user); else showLogin(); }
function showLogin(m) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginErr').textContent = m || ''; }
// sisselogimine kasutajanimega: "mart" -> mart@tel.hecada.com (e-posti aadressiga sisselogimine töötab edasi)
const loginEmail = (v) => { v = String(v || '').trim().toLowerCase(); return v.includes('@') ? v : v + '@tel.hecada.com'; };
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const { data, error } = await sb.auth.signInWithPassword({ email: loginEmail($('email').value), password: $('pass').value });
  if (error) return ($('loginErr').textContent = 'Vale e-post või parool.');
  enter(data.user);
});
$('logout').addEventListener('click', async () => { if (!confirmLeave()) return; await sb.auth.signOut(); showLogin(); });
async function enter(user) {
  const { data: me } = await sb.from('profiilid').select('id,nimi,roll,aktiivne').eq('id', user.id).single();
  if (!me || !me.aktiivne || !['admin', 'raamatupidaja'].includes(me.roll)) { await sb.auth.signOut(); return showLogin('Tellimused on kontori kasutajatele.'); }
  S.me = me; TelNav.roll(me.roll);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('newBtn').classList.toggle('hidden', !canEdit());
  await loadLookups();
  $('fKlient').innerHTML = '<option value="">Kõik kliendid</option>' + L.kliendid.map((k) => '<option value="' + k.id + '">' + esc(k.nimi) + '</option>').join('');
  syncFilterInputs();
  await load();
  routeFromUrl();
}
$('refresh').addEventListener('click', () => { if (O) { if (O.id && confirmLeave()) orderOpen(O.id); } else load(); });

// ------------------------------------------------------------ andmed
// Kiirus: vaikimisi laetakse pooleli/tarnimata tellimused + viimase 90 päeva tellimused; "Tarnitud", "Kõik" või
// vanem periood laeb kogu ajaloo (S.allLoaded).
const RECENT_DAYS = 90;
function needAll() {
  if (S.f === 'tarnitud' || S.f === 'koik') return true;
  if (S.per) { const r = perRange(); if (!r || r[0] < localIso(new Date(Date.now() - RECENT_DAYS * 86400000))) return true; }
  return false;
}

function perRange() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  const monday = (plusWeeks) => { const x = new Date(y, m, d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7) + plusWeeks * 7); return x; };
  const add = (x, n) => { const z = new Date(x); z.setDate(z.getDate() + n); return z; };
  switch (S.per) {
    case 't0': return [today(), today()];
    case 'w0': return [localIso(monday(0)), localIso(add(monday(0), 6))];
    case 'w1': return [localIso(monday(1)), localIso(add(monday(1), 6))];
    case 'm0': return [localIso(new Date(y, m, 1)), localIso(new Date(y, m + 1, 0))];
    case 'm1': return [localIso(new Date(y, m - 1, 1)), localIso(new Date(y, m, 0))];
    case 'd30': return [localIso(add(d, -30)), today()];

    case 'y0': return [y + '-01-01', y + '-12-31'];

    r.nimetus = (c[0] || '').trim(); if (c[1]) r.kogus = num(c[1]) ?? 1; if (c[2]) r.tk_hind = num(c[2]);
    return r;
  });
  const cur = O.rows[i0];
  if (cur && !cur.nimetus) O.rows.splice(i0, 1, ...newRows); else O.rows.splice(i0 + 1, 0, ...newRows);
  O.dirty = true;
  rerenderRows(); loadHistoryMany(true);
  toast(newRows.length + ' rida lisatud');
});
// ---------------- Exceli import (Joonise nr, Kogus, Hind, Tarneaeg)
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = () => bad(new Error('Exceli lugejat ei saanud laadida')); document.head.appendChild(sc); });
}
function cellDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000); return d.toISOString().slice(0, 10); }
  const p = parseDate(String(v)); return p || null;
}
async function importExcel(file) {
  try {
    await loadXlsx();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    const RX = { nimetus: /joonis|nimetus|detail|part|drawing/i, kogus: /kogus|qty|quantity|kog/i, hind: /hind|price|€/i, tarne: /tarne|tähtaeg|tahtaeg|delivery|date|kuup/i };
    let hi = grid.findIndex((row) => row && row.some((c) => typeof c === 'string' && RX.nimetus.test(c)));
    let col = { nimetus: 0, kogus: 1, hind: 2, tarne: 3 };
    if (hi >= 0) {
      const h = grid[hi].map((c) => (c === null ? '' : String(c)));
      Object.keys(RX).forEach((k) => { const i = h.findIndex((c) => RX[k].test(c)); if (i >= 0) col[k] = i; });
    }
    const data = grid.slice(hi + 1).filter((row) => row && row[col.nimetus] !== null && String(row[col.nimetus]).trim() !== '');
    if (!data.length) { toast('Failist ei leitud ühtegi rida', true); return; }
    const newRows = data.map((row) => {
      const r = blankRow();
      r.nimetus = String(row[col.nimetus]).trim();
      r.kogus = num(row[col.kogus]) ?? 1;
      r.tk_hind = num(row[col.hind]);
      r.tahtaeg = cellDate(row[col.tarne]);
      return r;
    });
    orderReadHead();
    const empty = O.rows.filter((r) => !(r.nimetus || '').trim()).length === O.rows.length;
    O.rows = empty ? newRows : O.rows.concat(newRows);
    if (!O.tarneaeg) { const d = newRows.map((r) => r.tahtaeg).filter(Boolean).sort()[0]; if (d) O.tarneaeg = d; }
    O.dirty = true;
    orderRender();
    loadHistoryMany(true);
    toast(newRows.length + ' rida imporditud failist ' + file.name);
  } catch (e) { toast('Import ebaõnnestus: ' + e.message, true); }
}
// ---------------- TG (Tech Group AS) ostutellimuse PDF import: read loetakse PDF-ist, päis käsitsi
function loadPdfjs() {
  if (window.pdfjsLib) return Promise.resolve();
  const base = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
  return new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = base + 'pdf.min.js'; sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; ok(); }; sc.onerror = () => bad(new Error('PDF-i lugejat ei saanud laadida')); document.head.appendChild(sc); });
}
function tgLines(items) {
  const its = items.filter((t) => t.str && t.str.trim()).sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  for (const t of its) { const l = lines[lines.length - 1]; if (l && Math.abs(l.y - t.y) < 2.5) l.p.push(t); else lines.push({ y: t.y, p: [t] }); }
  return lines.map((l) => l.p.sort((a, b) => a.x - b.x).map((t) => t.str.trim()).join(' ').replace(/\s+/g, ' ').trim());
}
const TG_RIDA = /^(\d+)\.\s+(\S+)\s+(\S+)\s+(.+?)\s+(\d+(?:[.,]\d+)?)\s+([A-Za-zÕÄÖÜõäöü]{1,5})\s+(\d{1,2}\.\d{1,2}\.\d{2,4})\s+(-?[\d\s]*\d,\d{2})\s+(-?[\d\s]*\d,\d{2})$/;
function tgNum(v) { return Number(String(v).replace(/[\s ]/g, '').replace(',', '.')); }
function tgParse(lines) {
  const res = { nr: '', ostja: '', neto: null, rows: [] };
  for (const l of lines) {
    let m;
    if (!res.nr && (m = l.match(/OSTUTELLIMUS\s+(\S+)/))) res.nr = m[1];
    if (!res.ostja && (m = l.match(/^Ostja:\s*(.+)$/))) res.ostja = m[1].trim();
    if (/Kokku EUR\s*\(\s*KM-ta\)/.test(l) && (m = l.match(/(-?[\d\s]*\d,\d{2})\s*$/))) res.neto = tgNum(m[1]);
    else if ((m = l.match(TG_RIDA))) res.rows.push({ nimetus: m[2], revisjon: m[3], kogus: tgNum(m[5]), uhik: m[6].toLowerCase(), tahtaeg: parseDate(m[7]) || null, tk_hind: tgNum(m[8]), summa: tgNum(m[9]) });
  }
  return res;
}
async function importTgPdf(files) {
  try {
    await loadPdfjs();
    const all = []; const warn = []; const nrs = []; let ostja = '';
    for (const f of files) {
      const doc = await window.pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
      let lines = [];
      for (let p = 1; p <= doc.numPages; p++) {
        const tc = await (await doc.getPage(p)).getTextContent();
        lines = lines.concat(tgLines(tc.items.map((t) => ({ str: t.str, x: t.transform[4], y: t.transform[5] }))));
      }
      doc.destroy();
      const P = tgParse(lines);
      if (!P.rows.length) { warn.push(f.name + ': ridu ei leitud (kas see on TG ostutellimus?)'); continue; }
      const s = Math.round(P.rows.reduce((a, r) => a + r.kogus * r.tk_hind, 0) * 100) / 100;
      if (P.neto !== null && Math.abs(s - P.neto) > 0.01) warn.push((P.nr || f.name) + ': summa ei klapi (' + fmtNum(s) + ' vs PDF ' + fmtNum(P.neto) + ' €)');
      const badRow = P.rows.find((r) => Math.abs(r.kogus * r.tk_hind - r.summa) > 0.01);
      if (badRow) warn.push((P.nr || f.name) + ': rea ' + badRow.nimetus + ' summa ei klapi');
      if (P.nr) nrs.push(P.nr); if (!ostja) ostja = P.ostja;
      all.push(...P.rows);
    }
    if (!all.length) { toast(warn.join('. ') || 'Ridu ei leitud', true); return; }
    orderReadHead();
    // päis: täidetakse ainult tühjad väljad
    if (!O.klient_id) { const k = L.kliendid.filter((x) => x.aktiivne !== false && /tech\s*group/i.test(x.nimi)); if (k.length === 1) O.klient_id = k[0].id; }
    if (!O.kliendi_tellimus && nrs.length) O.kliendi_tellimus = nrs.join(', ');
    if (!O.kontakt_id && ostja && O.klient_id) { const c = L.kontaktid.find((x) => String(x.klient_id) === String(O.klient_id) && (x.nimi || '').trim().toLowerCase() === ostja.toLowerCase()); if (c) O.kontakt_id = c.id; }
    const newRows = all.map((x) => Object.assign(blankRow(), { nimetus: x.nimetus, revisjon: x.revisjon, kogus: x.kogus, uhik: x.uhik || 'tk', tk_hind: x.tk_hind, tahtaeg: x.tahtaeg }));
    const empty = O.rows.every((r) => !(r.nimetus || '').trim());
    O.rows = empty ? newRows : O.rows.concat(newRows);
    if (!O.tarneaeg) { const d = newRows.map((r) => r.tahtaeg).filter(Boolean).sort()[0]; if (d) O.tarneaeg = d; }
    O.dirty = true;
    orderRender();
    loadHistoryMany(true);
    // kas see tellimus on juba sisestatud? (1 päring)
    if (nrs.length) {
      let q = sb.from('tellimused').select('id,nr,kliendi_tellimus').or(nrs.map((n) => 'kliendi_tellimus.ilike."*' + n.replace(/[^\w.\-]/g, '') + '*"').join(',')).limit(5);
      if (O.id) q = q.neq('id', O.id);
      const { data } = await q;
      if (data && data.length) warn.unshift('NB! ' + data.map((t) => t.kliendi_tellimus).join(', ') + ' on juba tellimuses ' + data.map((t) => t.nr).join(', '));
    }
    const sum = newRows.reduce((a, r) => a + r.kogus * r.tk_hind, 0);
    toast(newRows.length + ' rida PDF-ist (' + (nrs.join(', ') || files.map((f) => f.name).join(', ')) + '), ' + fmtNum(sum) + ' €. Kontrolli päis ja salvesta.', warn.length > 0);
    if ($('oErr')) $('oErr').textContent = warn.join(' · ');
  } catch (e) { toast('PDF import ebaõnnestus: ' + e.message, true); }
}
async function orderSave() {
  orderReadHead();
  const err = (m) => { $('oErr').textContent = m; };
  if (!O.klient_id) return err('Vali klient.');
  if (parseDate($('oTa').value) === undefined) return err('Tarneaeg peab olema kujul pp.kk.aaaa.');
  const rows = O.rows.filter((r) => (r.nimetus || '').trim());
  if (!rows.length) return err('Lisa vähemalt üks rida.');
  const bad = rows.find((r) => r.kogus === null || r.kogus <= 0);
  if (bad) return err('Rea "' + bad.nimetus + '" kogus puudub.');
  $('oSave').disabled = true; err('');
  const head = { klient_id: O.klient_id, kontakt_id: O.kontakt_id, kliendi_tellimus: O.kliendi_tellimus || null, tarneaeg: O.tarneaeg || null, markused: O.markused || null };
  try {
    let id = O.id;
    if (!id) {
      const { data, error } = await sb.from('tellimused').insert(head).select('id,nr').single();
      if (error) throw error; id = data.id; O.id = id; O.nr = data.nr;
    } else {
      const { error } = await sb.from('tellimused').update(head).eq('id', id); if (error) throw error;
    }
    const payload = (r) => ({ tellimus_id: id, nimetus: r.nimetus.trim(), revisjon: r.revisjon || null, kogus: r.kogus, uhik: r.uhik || 'tk', tk_hind: r.tk_hind || 0, tahtaeg: r.tahtaeg || null,
      materjal_id: r.materjal_id, materjali_hind: r.materjali_hind, pink_id: r.pink_id, allhange: r.allhange, allhankija: r.allhankija,
      teostaja_id: r.teostaja_id || null, norm: r.norm, staatus: r.staatus, pinnakate: r.pinnakate, ostuhind: r.ostuhind, markused: r.markused,
      ...(S.noV26 ? {} : { materjal_saabub: r.materjal_saabub || null }),
      ...(S.noV27 || r.paksus === undefined ? {} : { paksus: r.paksus ?? null, laius: r.laius ?? null, pikkus: r.pikkus ?? null, keerukus: r.keerukus ?? null }) });
    const ins = rows.filter((r) => !r.id).map(payload);
    if (ins.length) { const { error } = await sb.from('tellimuse_read').insert(ins); if (error) throw error; }
    for (const r of rows.filter((x) => x.id)) { const { error } = await sb.from('tellimuse_read').update(payload(r)).eq('id', r.id); if (error) throw error; }
    if (O.removed.length) { const { error } = await sb.from('tellimuse_read').delete().in('id', O.removed); if (error) throw error; }
    toast('Salvestatud: ' + O.nr);
    O.dirty = false;
    if (!new URLSearchParams(location.search).get('id')) history.replaceState({ id }, '', '?id=' + id);
    await orderOpen(id);
  } catch (e) { err(errText(e)); }
  finally { if ($('oSave')) $('oSave').disabled = false; }
}
// kogu tellimuse kustutamine (admin). Keelatud, kui töö on alanud/tehtud (tunnid kaoksid palgast) või midagi on tarnitud;
// saatelehel/arvel olevaid ridu ei lase andmebaas kustutada (23503).
async function orderDelete() {
  if (!O || !O.id) return;
  const { data: rs, error: e0 } = await sb.from('tellimuse_read').select('id,nimetus,staatus,tarnitud').eq('tellimus_id', O.id);
  if (e0) { toast(errText(e0), true); return; }
  const busy = (rs || []).filter((r) => !['cam', 'allhankes'].includes(r.staatus) || (r.tarnitud || 0) > 0);
  if (busy.length) { toast('Ei saa kustutada: ' + busy.length + ' rea töö on alanud, tehtud või tarnitud (nt ' + busy[0].nimetus + '). Eemalda ainult tegemata read.', true); return; }
  if (!confirm('Kustuta tellimus ' + O.nr + ' (' + (rs || []).length + ' rida)? Seda ei saa tagasi võtta.')) return;
  const nr = O.nr;
  const { error } = await sb.from('tellimused').delete().eq('id', O.id);
  if (error) { toast(error.code === '23503' ? 'Ei saa kustutada: tellimuse ridu on saatelehel või arvel.' : errText(error), true); return; }
  O.dirty = false;
  await backToList(true);
  toast('Tellimus ' + nr + ' kustutatud');
}
// kopeeri olemasolev tellimus uueks (sama klient ja read, uus number, staatus algusest)
function orderCopy() {

  O = { id: null, nr: '', klient_id: src.klient_id, kontakt_id: src.kontakt_id, kliendi_tellimus: '', tarneaeg: '', markused: '', removed: [], dirty: true,
