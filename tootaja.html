<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>TEL 2.0 – Tööd</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikoonid/favicon-48.png">
<link rel="apple-touch-icon" href="ikoonid/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TEL">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="pwa.js" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="periood.js"></script>
<style>
  :root {
    --bg: #F4F4F4; --panel: #FFFFFF; --ink: #161616; --muted: #525252; --soft: #393939;
    --line: #E0E0E0; --line2: #C6C6C6; --accent: #0F62FE; --seg: #E0E0E0;
    --late: #DA1E28; --today: #8E6A00; --done: #198038; --donebg: #DEFBE6;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: var(--ink); background: #E8E8E8; font-size: 15px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .shell { max-width: 560px; height: 100%; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; position: relative; overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px); }

  /* sisselogimine */
  .login { flex-grow: 1; display: flex; align-items: center; padding: 24px; }
  .login form { width: 100%; background: var(--panel); border: 1px solid var(--line); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .login h1 { margin: 0; font-size: 26px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input { height: 46px; padding: 0 12px; border: 1px solid var(--line2); border-bottom-color: #8D8D8D; background: var(--bg); }
  .primary { height: 50px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; }
  .err { color: var(--late); font-size: 14px; min-height: 18px; }

  /* päis */
  header.top { flex-shrink: 0; padding: 16px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  .titlerow { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .titlerow small { font-size: 13px; color: var(--muted); display: block; }
  .titlerow h1 { margin: 0; font-size: 28px; font-weight: 700; }
  .titlerow .right { text-align: right; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .who { height: 32px; border: 1px solid var(--line2); background: var(--panel); padding: 0 6px; max-width: 170px; }
  .plan { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .plan .t { display: flex; justify-content: space-between; font-size: 13px; }
  .plan .t b { font-family: var(--mono); font-weight: 600; }
  .bar { display: flex; gap: 3px; height: 12px; }
  .bar span { flex-basis: 0; border: 1px solid; transition: background-color .3s; min-width: 4px; }
  .search { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #8D8D8D; background: var(--panel); }
  .search input { border: none; background: transparent; flex-grow: 1; min-width: 0; outline: none; font-size: 15px; }
  .seg { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; padding: 2px; background: var(--seg); }
  .seg button { height: 34px; border: none; background: transparent; font-size: 12px; font-weight: 600; }
  .seg button.on { background: var(--ink); color: #fff; }

  main { flex-grow: 1; min-height: 0; overflow-y: auto; padding: 6px 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .filterbar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px 8px 12px; background: var(--panel); border: 1px solid var(--line); }
  .filterbar b { font-size: 13px; display: block; }
  .filterbar small { font-size: 12px; color: var(--muted); }
  .mini { display: flex; gap: 2px; padding: 2px; background: var(--seg); flex-shrink: 0; }
  .mini button { height: 30px; padding: 0 10px; border: none; background: transparent; font-size: 12px; font-weight: 600; }
  .mini button.on { background: var(--ink); color: #fff; }

  .grp { flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); }
  .grp-h { display: flex; flex-direction: column; gap: 6px; padding: 9px 12px; background: var(--bg); border-bottom: 1px solid var(--line2); transition: background-color .3s; }
  .grp-h.done { background: var(--donebg); }
  .grp-h .a { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .grp-h .a b { font-size: 15px; }
  .grp-h .a b.mono { font-family: var(--mono); }
  .grp-h .a small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp-h .b { display: flex; align-items: center; gap: 8px; }
  .cells { display: flex; gap: 3px; flex-grow: 1; flex-wrap: wrap; }
  .cells span { flex-grow: 1; max-width: 28px; min-width: 8px; height: 10px; border: 1px solid; transition: background-color .3s; }
  .badge { padding: 2px 8px; background: var(--done); color: #fff; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .prog { font-family: var(--mono); font-size: 12px; font-weight: 600; white-space: nowrap; }

  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 8px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .st { width: 56px; height: 48px; flex-shrink: 0; border: 1px solid; font-size: 12px; font-weight: 700; padding: 0; transition: background-color .2s, transform .12s; }
  .st:active { transform: scale(.93); }
  .st:disabled { cursor: default; }
  .open { flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0; border: none; background: transparent; text-align: left; }
  .thumb { width: 64px; height: 46px; flex-shrink: 0; border: 1px solid var(--line2); background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1; }
  .txt b { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .txt small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-family: var(--mono); font-size: 12px; flex-shrink: 0; }
  .rt b { font-weight: 600; }
  .rt small { color: var(--muted); }
  .dim { opacity: .55; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* staatuste värvid */
  .s-cam { background: #FCF4D6; color: #6B5000; border-color: #B28600; }
  .s-toos { background: #D0E2FF; color: #0043CE; border-color: #0043CE; }
  .s-ok, .s-valmis { background: #DEFBE6; color: #0E6027; border-color: #0E6027; }
  .s-pinnakattes, .s-allhankes { background: #E8DAFF; color: #6929C4; border-color: #6929C4; }
  .c-cam { background: #FFFFFF; border-color: #B28600; }
  .c-toos { background: #78A9FF; border-color: #0043CE; }
  .c-ok, .c-valmis, .c-pinnakattes, .c-allhankes { background: #24A148; border-color: #0E6027; }

  /* minu kuu */
  .card { flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .big { font-family: var(--mono); font-size: 38px; font-weight: 600; letter-spacing: -0.02em; }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .kv span:last-child { font-family: var(--mono); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; border-bottom: 1px solid var(--line2); }
  .bars span { flex-grow: 1; flex-basis: 0; background: #24A148; transition: height .3s; }
  .bars span.today { background: var(--accent); }
  .days { display: flex; gap: 3px; }
  .days span { flex-grow: 1; flex-basis: 0; text-align: center; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .days span.today { color: var(--accent); font-weight: 600; }

  .app { display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
  .work { display: flex; flex-direction: column; flex-grow: 1; min-height: 0; }
  .side { flex-shrink: 0; padding: 0 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  .detail { display: none; }
  #kuu { flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
  #kuu.hidden { display: none; }
  nav.tabs .brand { display: none; }
  nav.tabs { order: 99; }
  .row.sel { background: #EDF5FF; }
  .dnorm { display: none; }
  nav.tabs { flex-shrink: 0; display: flex; justify-content: space-around; background: var(--panel); border-top: 1px solid var(--line2);
    padding: 6px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  nav.tabs button { border: none; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); min-width: 68px; height: 52px; justify-content: center; }
  nav.tabs button.on { color: var(--accent); }

  /* detailileht */
  .dim-bg { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); border: none; padding: 0; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--panel); display: flex; flex-direction: column; overflow: hidden; }
  .sheet .hd { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px 6px 16px; }
  .sheet .hd span { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .sheet .hd button { height: 40px; padding: 0 10px; border: none; background: transparent; color: var(--accent); font-weight: 600; }
  .sheet .body { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 12px 12px; }
  .draw { height: 180px; border: 1px solid var(--line2); background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .sheet h2 { margin: 0; font-size: 20px; padding: 0 4px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); }
  .grid3 div { padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; }
  .grid3 div.w2 { grid-column: span 2; }
  .grid3 small { font-size: 11px; color: var(--muted); }
  .grid3 b { font-size: 14px; font-weight: 600; }
  .grid3 b.mono { font-family: var(--mono); }
  .hist { padding: 9px 12px; background: var(--bg); font-size: 14px; color: var(--soft); }
  .hist b { display: block; font-size: 13px; color: var(--ink); margin-bottom: 3px; }
  .stbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .stbtns button { height: 58px; border: 1px solid var(--line2); background: var(--panel); font-size: 16px; font-weight: 700; }
  .stbtns button.on-cam { background: #6B5000; border-color: #6B5000; color: #fff; }
  .stbtns button.on-toos { background: #0043CE; border-color: #0043CE; color: #fff; }
  .stbtns button.on-ok { background: #0E6027; border-color: #0E6027; color: #fff; }
  .stbtns button:disabled { opacity: .5; cursor: default; }

  #toast { position: absolute; left: 12px; right: 12px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; background: #262626; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 5; }
  #toast.line { background: #0E6027; }
  #toast.bad { background: var(--late); }
  #toast div { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  #toast b { font-size: 15px; }
  #toast small { font-size: 12px; color: #D6D6D6; }
  #toast button { height: 40px; padding: 0 12px; border: 1px solid #fff; background: transparent; color: #fff; font-weight: 600; flex-shrink: 0; }
  /* ---------- tööpäev ---------- */
  .shift { background: #161616; color: #F4F4F4; padding: 12px 14px; display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden; }
  .shift.on { background: linear-gradient(120deg, #0E6027 0%, #198038 60%, #24A148 100%); }
  .shift.warn { background: #A2191F; }
  .shift .info { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .shift .info small { font-size: 12px; opacity: .8; }
  .shift .clock { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .shift .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #A7F0BA; margin-right: 6px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .hold { --p: 0; position: relative; flex-shrink: 0; width: 84px; height: 84px; border-radius: 50%; border: none; padding: 0; color: #fff; font-weight: 700; font-size: 12px; line-height: 1.15;
    background: conic-gradient(#fff calc(var(--p) * 1%), rgba(255,255,255,.22) 0); touch-action: none; user-select: none; -webkit-user-select: none; }
  .hold span { position: absolute; inset: 5px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .hold.go span { background: #0F62FE; }
  .hold.stop span { background: #161616; }
  .hold small { font-weight: 400; font-size: 10px; opacity: .75; }
  .hold:active span { transform: scale(.96); }
  .shift .fix { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .shift .fix input { height: 38px; border: none; padding: 0 8px; font-family: var(--mono); font-size: 16px; }
  .shift .fix button { height: 38px; border: none; background: #fff; color: #A2191F; font-weight: 700; padding: 0 12px; }
  .tm-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .tm { width: 100%; max-width: 520px; background: #fff; padding: 18px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .tm h3 { margin: 0; font-size: 19px; }
  .tm .sub { font-size: 13px; color: var(--muted); }
  .tm .hm { display: flex; align-items: center; gap: 8px; }
  .tm .hm label { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .tm .hm input { height: 64px; font-family: var(--mono); font-size: 32px; text-align: center; border: 1px solid #8D8D8D; background: var(--bg); width: 100%; }
  .tm .hm b { font-size: 28px; padding-top: 18px; }
  .tm .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tm .chips button { height: 38px; padding: 0 12px; border: 1px solid var(--line2); background: #fff; font-weight: 600; font-size: 13px; }
  .tm .chips button.norm { border-color: #B28600; background: #FCF4D6; }
  .tm .act { display: flex; gap: 8px; }
  .tm .act button { height: 54px; border: 1px solid var(--line2); background: #fff; font-weight: 700; font-size: 16px; padding: 0 16px; }
  .tm .act .ok { flex-grow: 1; background: #0E6027; border-color: #0E6027; color: #fff; }
  .tm .err { min-height: 0; }
  .shifts { display: flex; flex-direction: column; }
  .sh { display: grid; grid-template-columns: 74px 1fr 1fr 64px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .sh input { height: 38px; border: 1px solid var(--line2); background: var(--bg); font-family: var(--mono); font-size: 15px; padding: 0 6px; width: 100%; min-width: 0; }
  .sh .d { font-family: var(--mono); font-size: 13px; }
  .sh .d small { display: block; color: var(--muted); font-family: inherit; }
  .sh .k { font-family: var(--mono); text-align: right; font-weight: 600; }
  .sh.edited .k::after { content: ' ✎'; color: var(--muted); font-weight: 400; }
  .sh input.saved { background: #DEFBE6; }
  .addday { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 6px; margin-top: 8px; }
  .addday input { height: 38px; border: 1px solid var(--line2); background: var(--bg); padding: 0 6px; font-family: var(--mono); min-width: 0; width: 100%; }
  .addday button { height: 38px; border: none; background: var(--accent); color: #fff; font-weight: 700; padding: 0 12px; }

  /* ---------- arvutivaade ---------- */
  @media (min-width: 1100px) {
    body { background-color: #F4F4F4; background-image: linear-gradient(#E6E6E6 1px, transparent 1px), linear-gradient(90deg, #E6E6E6 1px, transparent 1px); background-size: 16px 16px; font-size: 14px; }
    .shell { max-width: none; background: transparent; }
    nav.tabs { order: 0; justify-content: flex-start; gap: 4px; background: #161616; border: none; padding: 0 20px; height: 52px; align-items: stretch; }
    nav.tabs .brand { display: flex; align-items: center; color: #F4F4F4; font-family: var(--mono); font-weight: 600; font-size: 16px; margin-right: 20px; }
    nav.tabs button { flex-direction: row; gap: 8px; height: auto; min-width: 0; padding: 0 14px; color: #C6C6C6; font-size: 14px; font-weight: 500; border-bottom: 3px solid transparent; }
    nav.tabs button svg { width: 18px; height: 18px; }
    nav.tabs button.on { color: #FFFFFF; border-bottom-color: #0F62FE; font-weight: 600; }
    nav.tabs #home { margin-left: auto; }
    header.top { flex-direction: row; align-items: center; gap: 24px; padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header.top .titlerow { width: 360px; flex-shrink: 0; }
    header.top .plan { flex-grow: 1; }
    header.top .shift { width: 380px; flex-shrink: 0; }
    .work { flex-direction: row; gap: 16px; padding: 16px 24px 20px; }
    .side { width: 240px; padding: 14px; background: var(--panel); border: 1px solid var(--line); align-self: flex-start; }
    .seg { grid-template-columns: 1fr; }
    .seg button { text-align: left; padding: 0 12px; font-size: 14px; height: 36px; }
    main#list { padding: 0; }
    .row { padding: 6px 12px 6px 10px; }
    .st { width: 76px; height: 36px; }
    .thumb { width: 96px; height: 68px; }
    .row { padding: 6px 12px 6px 10px; }
    .dnorm { display: inline; }
    .detail { display: flex; flex-direction: column; width: 400px; flex-shrink: 0; background: var(--panel); border: 1px solid var(--line); min-height: 0; overflow: hidden; }
    .detail .body { overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
    .detail .draw { height: 240px; }
    .detail .ph { flex-grow: 1; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 24px; }
    #kuu { width: 100%; max-width: 760px; margin: 0 auto; padding: 24px; }
    #sheetWrap { display: none !important; }
    #toast { left: 50%; right: auto; transform: translateX(-50%); min-width: 440px; bottom: 28px; }
  }
  /* ---------- kontor: tabel ja statistika ---------- */
  nav.tabs.many button { min-width: 0; flex: 1 1 0; font-size: 10px; }
  .pane { flex-grow: 1; min-height: 0; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .pane h2 { margin: 0; font-size: 22px; }
  .pane h3 { margin: 0; font-size: 15px; }
  .tbar { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; }
  .tbar select, .tbar input:not([type=checkbox]) { height: 34px; border: 1px solid var(--line2); background: #fff; padding: 0 8px; font-size: 13px; min-width: 0; }
  .tbar input.q { flex: 1 1 200px; }
  .tbar .sp { flex-grow: 1; }
  .tbar small { color: var(--muted); font-size: 12px; }
  .btn { height: 34px; padding: 0 12px; border: 1px solid var(--line2); background: var(--panel); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.del { color: var(--late); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { height: 30px; padding: 0 10px; border: 1px solid; font-size: 12px; font-weight: 700; opacity: .4; }
  .chip.on { opacity: 1; }
  .tw { overflow: auto; border: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .pane > .tw.grow { flex-shrink: 1; min-height: 200px; }
  table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.t th, table.t td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  table.t thead th { position: sticky; top: 0; z-index: 1; background: #E8E8E8; font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line2); }

function bindHold(btn, action) {
  const DUR = 900; let raf = null, t0 = 0;
  const reset = () => { cancelAnimationFrame(raf); raf = null; btn.style.setProperty('--p', 0); };
  const step = (t) => {
    const p = Math.min(100, (t - t0) / DUR * 100); btn.style.setProperty('--p', p);
    if (p >= 100) { raf = null; try { navigator.vibrate && navigator.vibrate([15, 40, 25]); } catch (e) {} action(); return; }
    raf = requestAnimationFrame(step);
  };
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); t0 = performance.now(); raf = requestAnimationFrame(step); try { navigator.vibrate && navigator.vibrate(8); } catch (x) {} });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => btn.addEventListener(ev, () => { if (raf) reset(); }));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); action(); } });
}

function askTime(r) {
  return new Promise((resolve) => {
    const bg = document.createElement('div'); bg.className = 'tm-bg';
    const nh = r.norm ? Math.floor(r.norm) : '', nm = r.norm ? Math.round((r.norm % 1) * 60) : '';

      '<div class="sub"><b>' + esc(r.nimetus) + '</b>, ' + esc(fmt1(r.kogus).replace(',0', '')) + ' ' + esc(r.uhik) + (r.norm ? '. Norm ' + fmt1(r.norm) + ' h.' : '') + '</div>' +
      '<div class="hm"><label>Tunnid<input id="tmH" type="number" inputmode="numeric" min="0" max="999" placeholder="0"></label><b>:</b><label>Minutid<input id="tmM" type="number" inputmode="numeric" min="0" max="59" step="5" placeholder="00"></label></div>' +
      '<div class="chips">' + (r.norm ? '<button type="button" class="norm" data-h="' + nh + '" data-m="' + nm + '">Nagu norm, ' + fmt1(r.norm) + ' h</button>' : '') +
        [[0, 30], [1, 0], [2, 0], [4, 0], [8, 0]].map(([h, m]) => '<button type="button" data-h="' + h + '" data-m="' + m + '">' + (h ? h + ' h' : '') + (m ? m + ' min' : '') + '</button>').join('') + '</div>' +
      '<div class="err" id="tmE"></div>' +
      '<div class="act"><button type="button" id="tmX">Tühista</button><button type="button" class="ok" id="tmOk">Märgi OK</button></div></div>';
    document.body.appendChild(bg);
    const done = (v) => { bg.remove(); resolve(v); };
    bg.querySelectorAll('[data-h]').forEach((b) => b.onclick = () => { $('tmH').value = b.dataset.h; $('tmM').value = b.dataset.m; });
    $('tmX').onclick = () => done(null);
    bg.addEventListener('click', (e) => { if (e.target === bg) done(null); });
    const ok = () => {
      const h = Number($('tmH').value || 0), m = Number($('tmM').value || 0);
      const v = Math.round((h + m / 60) * 100) / 100;
      if (!(v > 0)) { $('tmE').textContent = 'Sisesta aeg, mis tööle kulus.'; return; }
      done(v);
    };
    $('tmOk').onclick = ok;
    bg.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') done(null); });
    setTimeout(() => $('tmH').focus(), 50);
  });
}

// ------------------------------------------------------------- ühine koormuse plaan (riba + Koormuse vaheleht)
// Tööd tähtaja järjekorras (EDD, töös olevad enne), iga tööpäev = nädala norm / 5 h; riigipühad ja puhkused = 0 h.
// Tulemus: iga töö prognoositud algus/lõpp (päev + osa päevast), hilinemised ja nädalate kokkuvõte.
const EDD = (a, b) => String(a.tahtaeg || '9999').localeCompare(String(b.tahtaeg || '9999')) || (b.staatus === 'toos') - (a.staatus === 'toos') || a.id - b.id;
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00') - Date.parse(a + 'T12:00:00')) / 86400000);
function planWorker(w, rows, minDays, order) {
  const T = today();
  const lv = (S.lvs || []).filter((p) => p.profiil_id === w.id);
  const dn = w && w.nadala_norm ? Number(w.nadala_norm) / 5 : 0;
  const onLeave = (iso) => lv.some((p) => p.algus <= iso && p.lopp >= iso);
  const days = []; const d = new Date(T + 'T12:00:00');
  const ensure = (i) => { while (days.length <= i) { const iso = localIso(d); const wd = isWorkday(iso), lvx = wd && onLeave(iso); days.push({ iso, wd, leave: lvx, cap: dn && wd && !lvx ? dn : 0 }); d.setDate(d.getDate() + 1); } };
  const act = (order || orderRows(rows.filter((r) => ACTIVE.includes(r.staatus)))).filter((r) => ACTIVE.includes(r.staatus));
  const jobs = []; let di = 0, used = 0;
  act.forEach((r) => {
    const j = { r, overdue: !!r.tahtaeg && r.tahtaeg < T };
    if (dn) {
      ensure(di);
      while (days[di].cap - used <= 1e-9 && di < 2000) { di++; used = 0; ensure(di); }
      j.s = di + used / days[di].cap;
      let h = r.norm;
      while (h > 1e-9 && di < 2000) {
        ensure(di); const av = days[di].cap - used;
        if (av <= 1e-9) { di++; used = 0; continue; }
        const t = Math.min(av, h); h -= t; used += t;
      }
      ensure(di);
      j.e = di + (days[di].cap ? used / days[di].cap : 1);
      j.fin = days[di].iso;
      j.late = !!r.tahtaeg && j.fin > r.tahtaeg;
      j.lateDays = r.tahtaeg && j.late ? daysBetween(r.tahtaeg, j.fin) : 0;
    }
    jobs.push(j);
  });
  ensure(Math.max(minDays || 0, di + 1));
  const total = act.reduce((a, r) => a + r.norm, 0);
  return { w, dn, days, jobs, total, free: dn ? (jobs.length ? jobs[jobs.length - 1].fin : T) : null,
    overdue: jobs.filter((j) => j.overdue), risk: jobs.filter((j) => j.late && !j.overdue) };
}
function weeksN(n) {
  const d0 = new Date(today() + 'T12:00:00'); const mon = new Date(d0); mon.setDate(d0.getDate() - (d0.getDay() + 6) % 7);
  const out = [];
  for (let i = 0; i < n; i++) { const s = new Date(mon); s.setDate(mon.getDate() + i * 7); const e = new Date(s); e.setDate(s.getDate() + 6); out.push({ s: localIso(s), e: localIso(e) }); }
  return out;
}
// nädalate kokkuvõte: töö tähtaja järgi (hilinenud + tähtajata → see nädal), võimsus, kumulatiivne vaba
function weekStats(P, weeks) {
  const T = today();
  const nW = weeks.map(() => 0), cW = weeks.map(() => 0); let later = 0;
  P.jobs.forEach((j) => { const i = wIdx(j.r, weeks); if (i >= 0) nW[i] += j.r.norm; else later += j.r.norm; });
  const capOf = (iso) => { const x = P.days.find((y) => y.iso === iso); return x ? x.cap : (P.dn && iso >= T && isWorkday(iso) ? P.dn : 0); };
  weeks.forEach((x, i) => { for (let d = new Date(x.s + 'T12:00:00'); localIso(d) <= x.e; d.setDate(d.getDate() + 1)) { const iso = localIso(d); if (iso >= T) cW[i] += capOf(iso); } });
  let kn = 0, kc = 0; const slack = weeks.map((x, i) => { kn += nW[i]; kc += cW[i]; return kc - kn; });
  return { nW, cW, slack, later };
}
// riba jaoks (sama plaan → riba ja Koormuse vaheleht näitavad alati sama)
function workerLoad(w, rows, weeks) {
  const P = planWorker(w, rows, 35); const W = weekStats(P, weeks);
  const late = P.overdue.map((j) => j.r);
  return { w, late, lateH: late.reduce((a, r) => a + r.norm, 0), nW: W.nW, cW: W.cW, risk: P.risk.map((j) => j.r), dn: P.dn };
}

// Eesti riigipühad (tööpäevadel vabad päevad)
const _hol = {};
function holidays(y) {
  if (_hol[y]) return _hol[y];
  // lihavõtted (Gaussi/Meeus'i valem) -> suur reede
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  const gf = localIso(new Date(y, mo - 1, da - 2));
  _hol[y] = new Set(['01-01', '02-24', '05-01', '06-23', '06-24', '08-20', '12-24', '12-25', '12-26'].map((x) => y + '-' + x).concat([gf]));
  return _hol[y];
}
const isoOf = (y, m, d) => localIso(new Date(y, m, d));
function isWorkday(iso) { const d = new Date(iso + 'T12:00:00'); const wd = d.getDay(); return wd !== 0 && wd !== 6 && !holidays(d.getFullYear()).has(iso); }
function isoWeek(iso) {
  const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7);
}
const seade = (k) => { const x = ST2.data && ST2.data.seaded.find((s) => s.voti === k); return x && x.vaartus !== null ? Number(x.vaartus) : null; };
function workdaysMonth(y, m, upto) {   // upto = iso (kaasa arvatud) või null
  let n = 0; const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) { const iso = isoOf(y, m, d); if (upto && iso > upto) break; if (isWorkday(iso)) n++; }
  return n;
}
const monthDays = (y, m) => { const o = seade('toopaevi_' + y + '_' + pad(m + 1)); return o !== null ? o : workdaysMonth(y, m); };
function onLeave(wid, iso) { return (ST2.data.puh || []).find((p) => p.profiil_id === wid && p.algus <= iso && p.lopp >= iso) || null; }
function leaveDays(wid, from, to) {   // tööpäevad puhkusel vahemikus
  let n = 0;
  (ST2.data.puh || []).filter((p) => (!wid || p.profiil_id === wid) && p.algus <= to && p.lopp >= from).forEach((p) => {
    const a = p.algus > from ? p.algus : from, b = p.lopp < to ? p.lopp : to;
    for (let d = new Date(a + 'T12:00:00'); localIso(d) <= b; d.setDate(d.getDate() + 1)) if (isWorkday(localIso(d))) n++;
  });
  return n;
}

// ---------- Kuud: normtunnid, tööl viibitud aeg, palk (kuu × töötaja)
function statKuud() {
  const D = ST2.data, y = ST2.year, W = statWorkers(), T = today(), adm = ISADMIN();
  const goal = seade('kuu_normi_eesmark') ?? 1000;
  const nm = {}, tm = {}; W.forEach((w) => { nm[w.id] = Array(12).fill(0); tm[w.id] = Array(12).fill(0); });
  let noWho = Array(12).fill(0);
  D.ok.forEach((r) => { const m = Number(r.day.slice(5, 7)) - 1; if (nm[r.teostaja_id]) nm[r.teostaja_id][m] += r.norm; else noWho[m] += r.norm; });
  D.shifts.forEach((x) => { if (!x.lopp || !tm[x.profiil_id]) return; tm[x.profiil_id][Number(x.day.slice(5, 7)) - 1] += (Date.parse(x.lopp) - Date.parse(x.algus)) / 3600000; });
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const curM = y === now0.getFullYear() ? now0.getMonth() : y < now0.getFullYear() ? 12 : -1;
  // lahtri värv: roheline, kui töötaja on oma nädala normi tempos (arvestab puhkust), muidu punane
  const color = (w, m, v) => {
    if (!w.nadala_norm || m > curM) return '';
    const from = isoOf(y, m, 1), to = m === curM ? T : isoOf(y, m + 1, 0);
    const days = workdaysMonth(y, m, to) - leaveDays(w.id, from, to);
    return days <= 0 ? '' : v >= days * dayNorm(w) ? 'pos' : 'neg';
  };
  const wh = W.map((w) => '<th class="n">' + esc(w.nimi) + '</th>').join('');
  let rows1 = '', rows2 = '', rows3 = '';
  for (let m = 0; m < 12; m++) {
    const tot = W.reduce((s, w) => s + nm[w.id][m], 0) + noWho[m];
    const from = isoOf(y, m, 1), to = isoOf(y, m + 1, 0);
    const leave = W.map((w) => leaveDays(w.id, from, to));
    const leaveH = W.reduce((s, w, i) => s + leave[i] * dayNorm(w), 0);
    const days = monthDays(y, m), past = m <= curM;
    const withL = tot + leaveH;
    const ovr = seade('toopaevi_' + y + '_' + pad(m + 1)) !== null;
    rows1 += '<tr' + (m === curM ? ' class="selr"' : '') + '><td>' + (m + 1) + '</td><td>' + KUUD_S[m] + '</td><td class="n"><b>' + fmt1(tot) + '</b></td>' +
      W.map((w) => '<td class="n ' + color(w, m, nm[w.id][m]) + '">' + fmt1(nm[w.id][m]) + '</td>').join('') +
      '<td class="n bl">' + (sum(leave) || '') + '</td><td class="n">' + fmt1(withL) + '</td>' +
      '<td class="n ' + (past ? (withL - goal >= 0 ? 'pos' : 'neg') : 'mut') + '"><b>' + (past ? (withL - goal > 0 ? '+' : '') + fmt1(withL - goal) : '–') + '</b></td>' +
      '<td class="n">' + (adm ? '<input type="number" min="0" max="31" data-days="' + m + '" value="' + (ovr ? days : '') + '" placeholder="' + workdaysMonth(y, m) + '" aria-label="Tööpäevi" title="Tühi = riigipühade järgi arvutatud">' : days) + '</td>' +
      '<td class="n">' + fmt1(days * 8) + '</td></tr>';
    const ttot = W.reduce((s, w) => s + tm[w.id][m], 0);
    rows2 += '<tr' + (m === curM ? ' class="selr"' : '') + '><td>' + KUUD_S[m] + '</td><td class="n"><b>' + hmm(ttot) + '</b></td>' + W.map((w) => '<td class="n">' + hmm(tm[w.id][m]) + '</td>').join('') + '</tr>';
    const pay = W.map((w) => past && (nm[w.id][m] || tm[w.id][m]) ? Number(w.pohipalk || 0) + nm[w.id][m] * Number(w.normtunni_tasu || 0) : 0);
    rows3 += '<tr' + (m === curM ? ' class="selr"' : '') + '><td>' + KUUD_S[m] + '</td><td class="n"><b>' + (sum(pay) ? eur(sum(pay)) : '–') + '</b></td>' + pay.map((p) => '<td class="n">' + (p ? eur(p) : '–') + '</td>').join('') + '</tr>';
  }
  const yN = W.map((w) => sum(nm[w.id])), yT = W.map((w) => sum(tm[w.id]));
  const totN = sum(yN) + sum(noWho), totT = sum(yT);
  const r2 = (n, t) => t ? (Math.round(n / t * 100) / 100).toFixed(2).replace('.', ',') : '–';
  // KPI-d: jooksev kuu
  const cm = curM >= 0 && curM < 12 ? curM : 11;
  const cmN = W.reduce((s, w) => s + nm[w.id][cm], 0) + noWho[cm], cmT = W.reduce((s, w) => s + tm[w.id][cm], 0);
  return '<div class="kpis">' +
      '<div><small>Normtunnid ' + KUUD[cm] + '</small><b>' + fmt1(cmN) + ' h</b></div>' +
      '<div><small>Eesmärk kuus</small><b>' + (adm ? '<input type="number" id="sGoal" value="' + goal + '" style="width:110px;height:32px;font:inherit;font-size:18px;border:1px solid var(--line2)" aria-label="Kuu eesmärk"> h' : fmt1(goal) + ' h') + '</b></div>' +
      '<div><small>Tööl viibitud ' + KUUD[cm] + '</small><b>' + hmm(cmT) + '</b></div>' +
      '<div><small>Norm / tööaeg ' + KUUD[cm] + '</small><b>' + r2(cmN, cmT) + '</b></div>' +
      '<div><small>Normtunnid ' + y + '</small><b>' + fmt1(totN) + ' h</b></div></div>' +
    '<div class="wblk"><h3>Normtunnid (valmis tööd OK-ks märkimise kuu järgi)</h3></div>' +
    '<div class="tw"><table class="t"><thead><tr><th></th><th>Kuu</th><th class="n">Kokku</th>' + wh +

// ---------- Tööajad: päevad × töötajad (algus, lõpp, tööaeg, norm)
function statPaevad() {
  const D = ST2.data, y = ST2.year, m = ST2.month, W = statWorkers(), T = today();
  const last = new Date(y, m + 1, 0).getDate();
  const byWD = {}; D.shifts.forEach((x) => { const k = x.profiil_id + '|' + x.day; (byWD[k] = byWD[k] || []).push(x); });
  const nWD = {}; D.ok.forEach((r) => { const k = r.teostaja_id + '|' + r.day; nWD[k] = (nWD[k] || 0) + r.norm; });
  const tot = W.map((w) => { let h = 0, n = 0; for (let d = 1; d <= last; d++) { const iso = isoOf(y, m, d); (byWD[w.id + '|' + iso] || []).forEach((x) => { if (x.lopp) h += (Date.parse(x.lopp) - Date.parse(x.algus)) / 3600000; }); n += nWD[w.id + '|' + iso] || 0; } return { h, n }; });
  let body = '';
  for (let d = 1; d <= last; d++) {
    const iso = isoOf(y, m, d), dt = new Date(y, m, d), wd = (dt.getDay() + 6) % 7 + 1;
    const hol = holidays(y).has(iso), off = wd > 5 || hol;
    body += '<tr class="' + (off ? 'wk' : '') + (iso === T ? ' selr' : '') + '"><td class="n">' + isoWeek(iso) + '</td><td class="n">' + wd + '</td><td class="m">' + pad(d) + '.' + pad(m + 1) + '.' + y + (hol ? ' <span class="mut" title="Riigipüha">★</span>' : '') + '</td>' +
      W.map((w) => {
        const xs = byWD[w.id + '|' + iso] || [], n = nWD[w.id + '|' + iso] || 0;
        const lv = onLeave(w.id, iso);
        if (!xs.length) return lv && !off ? '<td class="bl mut" colspan="3" style="text-align:center">' + esc(lv.liik.toLowerCase()) + '</td><td class="n mut">' + (n ? fmt1(n) : '') + '</td>'
          : '<td class="bl"></td><td></td><td class="n mut">' + (off ? '' : '0') + '</td><td class="n mut">' + (n ? fmt1(n) : '') + '</td>';
        const a = xs.reduce((p, x) => x.algus < p ? x.algus : p, xs[0].algus);
        const open = xs.some((x) => !x.lopp), l = open ? null : xs.reduce((p, x) => x.lopp > p ? x.lopp : p, xs[0].lopp);
        const h = xs.reduce((s, x) => s + (x.lopp ? (Date.parse(x.lopp) - Date.parse(x.algus)) / 3600000 : 0), 0);
        const ed = xs.some((x) => x.muudetud);
        return '<td class="bl m pos">' + hm(a) + '</td><td class="m neg">' + (open ? 'käib' : hm(l)) + '</td><td class="n"><b>' + hmm(h) + '</b>' + (ed ? ' <span class="mut" title="Käsitsi parandatud">✎</span>' : '') + (xs.length > 1 ? ' <span class="mut" title="' + xs.length + ' tööperioodi">(' + xs.length + ')</span>' : '') + '</td><td class="n mut">' + (n ? fmt1(n) : '') + '</td>';
      }).join('') + '</tr>';
  }
  return '<div class="tw grow"><table class="t"><thead>' +
    '<tr><th colspan="3"></th>' + W.map((w, i) => '<th class="grp" colspan="4">' + esc(w.nimi) + ' · ' + hmm(tot[i].h) + ' · ' + fmt1(tot[i].n) + ' nh</th>').join('') + '</tr>' +
    '<tr><th class="n">N</th><th class="n">P</th><th>Kuupäev</th>' + W.map(() => '<th class="bl pos">Algus</th><th class="neg">Lõpp</th><th class="n">Tööaeg</th><th class="n">Norm h</th>').join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<div class="note">Norm h = sel päeval OK-ks märgitud tööde normtunnid. ✎ = kellaaega on käsitsi parandatud. Tööaegu parandad vahelehel "Töötaja kuu" (vali enne üleval töötaja) või töömees ise.</div>';
}

// ---------- Koormus: pooleli tööde normtunnid nädalate kaupa vs töötaja võimsus (vana Exceli prognoos)
function statKoormus() {
  const D = ST2.data, T = today(), adm = ISADMIN();
  const W = T2.workers.filter((w) => w.aktiivne);
  const d0 = new Date(T + 'T12:00:00'); const mon = new Date(d0); mon.setDate(d0.getDate() - (d0.getDay() + 6) % 7);
  const NW = 12; const weeks = [];
  for (let i = 0; i < NW; i++) { const s = new Date(mon); s.setDate(mon.getDate() + i * 7); const e = new Date(s); e.setDate(s.getDate() + 6); weeks.push({ s: localIso(s), e: localIso(e) }); }
  const capDay = (w, iso) => iso >= T && isWorkday(iso) && !onLeave(w.id, iso) ? dayNorm(w) : 0;
  const noWho = D.pool.filter((r) => !r.teostaja_id);
  let summary = '', blocks = '';
  W.forEach((w) => {
    const rows = D.pool.filter((r) => r.teostaja_id === w.id);
    const total = rows.reduce((s, r) => s + r.norm, 0);
    const nW = Array(NW).fill(0); let later = 0;
    rows.forEach((r) => {
      const t = r.tahtaeg; let i = !t || t < weeks[0].s ? 0 : weeks.findIndex((x) => t >= x.s && t <= x.e);
      if (i < 0) later += r.norm; else nW[i] += r.norm;
    });
    const cW = weeks.map((x) => { let c = 0; for (let d = new Date(x.s + 'T12:00:00'); localIso(d) <= x.e; d.setDate(d.getDate() + 1)) c += capDay(w, localIso(d)); return c; });
    let kn = 0, kc = 0; const kN = [], kC = [], vaba = [];
    for (let i = 0; i < NW; i++) { kn += nW[i]; kc += cW[i]; kN.push(kn); kC.push(kc); vaba.push(kc - kn); }
    const behind = dayNorm(w) > 0 && vaba.some((v) => v < -0.05);
    // millal kõik pooleli tööd tehtud (päev-päevalt võimsust kokku liites)
    let free = null;
    if (total <= 0) free = T;
    else if (dayNorm(w) > 0) { let acc = 0; const d = new Date(T + 'T12:00:00'); for (let k = 0; k < 1100; k++) { const iso = localIso(d); acc += capDay(w, iso); if (acc >= total - 1e-6) { free = iso; break; } d.setDate(d.getDate() + 1); } }
    const hilisem = rows.filter((r) => r.tahtaeg).reduce((p, r) => r.tahtaeg > p ? r.tahtaeg : p, '');
    summary += '<tr><td><b>' + esc(w.nimi) + '</b></td><td class="n">' + rows.length + '</td><td class="n"><b>' + fmt1(total) + '</b></td>' +
      '<td class="n">' + (adm ? '<input type="number" min="0" step="1" data-nn="' + w.id + '" value="' + (w.nadala_norm ?? '') + '" placeholder="nt 50" aria-label="Nädala norm">' : (w.nadala_norm ? fmt1(w.nadala_norm) : '–')) + '</td>' +
      '<td class="m ' + (free ? (behind ? 'neg' : 'pos') : 'mut') + '"><b>' + (free ? free.split('-').reverse().join('.') : 'nädala norm määramata') + '</b></td>' +
      '<td class="m">' + (hilisem ? hilisem.split('-').reverse().join('.') : '–') + '</td>' +
      '<td>' + (behind ? '<span class="tag" style="color:var(--late);border-color:var(--late)">Tähtajad ohus</span>' : total ? '<span class="tag" style="color:var(--done);border-color:var(--done)">Graafikus</span>' : '') + '</td></tr>';
    const cell = (v, cls) => '<td class="n ' + (cls || '') + '">' + fmt1(v) + '</td>';
    blocks += '<div class="wblk"><h3>' + esc(w.nimi) + (later ? ' <span class="mut" style="font-weight:400;font-size:13px">+ ' + fmt1(later) + ' h hiljem kui 12 nädalat</span>' : '') + '</h3></div>' +
      '<div class="tw"><table class="t"><tbody>' +
      '<tr class="sub"><td>algus</td>' + weeks.map((x) => '<td class="n">' + ddmm(x.s) + '.' + x.s.slice(0, 4) + '</td>').join('') + '</tr>' +
      '<tr style="background:#FFF8C5"><td><b>Nädal</b></td>' + weeks.map((x) => '<td class="n"><b>' + isoWeek(x.s) + '</b></td>').join('') + '</tr>' +
      '<tr style="background:#EDF5FF"><td><b>Norm tunde</b></td>' + nW.map((v) => cell(v)).join('') + '</tr>' +
      '<tr><td>Kumm</td>' + kN.map((v) => cell(v)).join('') + '</tr>' +
      '<tr class="sub"><td>Prog. norm h</td>' + cW.map((v) => cell(v)).join('') + '</tr>' +
      '<tr class="sub"><td>Kumm töö</td>' + kC.map((v) => cell(v)).join('') + '</tr>' +
      '<tr style="background:#F4F4F4"><td><b>Vaba</b></td>' + vaba.map((v) => '<td class="n ' + (v < -0.05 ? 'neg' : 'pos') + '"><b>' + fmt1(v) + '</b></td>').join('') + '</tr>' +
      '</tbody></table></div>';
  });
  return '<div class="tw"><table class="t"><thead><tr><th>Töötaja</th><th class="n">Pooleli töid</th><th class="n">Pooleli h</th><th class="n">Nädala norm h</th><th>Vaba alates</th><th>Hiliseim tähtaeg</th><th></th></tr></thead><tbody>' + summary + '</tbody></table></div>' +
    '<div class="note">Pooleli = CAM teha + Töös. Hilinenud ja tähtajata tööd on arvestatud esimesse nädalasse. "Prog. norm h" = nädala norm (arvestab tänasest alates, riigipühi ja puhkusi). ' +
      '"Vaba" = kumulatiivne võimsus − kumulatiivne töö; punane tähendab, et tähtajaks ei jõua. ' + (adm ? 'Nädala normi saab muuta siin või Kontor → Kasutajad.' : '') +
      (noWho.length ? ' <b>Teostajata pooleli töid: ' + noWho.length + ' (' + fmt1(noWho.reduce((s, r) => s + r.norm, 0)) + ' h).</b>' : '') + '</div>' + blocks;
}

TelPer.init('toodnorm', () => { if (ST2.view === 'norm') renderStat(); });
function statNorm() {

        '<td class="m">' + esc(x.last.tel) + ', ' + ddmm(x.last.day) + '</td><td>' + esc(x.who) + '</td></tr>').join('') : '<tr><td colspan="11" class="empty">Selliseid detaile pole.</td></tr>') +

    table = '<div class="tw grow"><table class="t"><thead><tr><th class="n">Töö nr</th><th>Tellimus</th><th>Klient</th><th>Detail</th><th class="n">Kogus</th><th>Pink</th><th>Teostaja</th><th>OK</th><th class="n">Norm h</th><th class="n">Tegelik h</th><th class="n">Vahe h</th><th class="n">Erinevus</th></tr></thead><tbody>' +

function wdBetween(a, b, y) {
  if (y) { a = a > y + '-01-01' ? a : y + '-01-01'; b = b < y + '-12-31' ? b : y + '-12-31'; }
  let n = 0; for (let d = new Date(a + 'T12:00:00'); localIso(d) <= b; d.setDate(d.getDate() + 1)) if (isWorkday(localIso(d))) n++;
  return n;
}

// statistika sündmused
async function setSeade(voti, vaartus) {
  const q = vaartus === null ? sb.from('seaded').delete().eq('voti', voti) : sb.from('seaded').upsert({ voti, vaartus });
  const { error } = await q;
  if (error) { showToast({ bad: true, text: 'Ei õnnestunud', sub: error.message }); return false; }
  const s = ST2.data.seaded; const i = s.findIndex((x) => x.voti === voti);
  if (vaartus === null) { if (i >= 0) s.splice(i, 1); } else if (i >= 0) s[i].vaartus = vaartus; else s.push({ voti, vaartus });
  showToast({ text: 'Salvestatud' }); return true;
}
$('stat').addEventListener('click', async (e) => {
  const v = e.target.closest('[data-v]');
  if (v) { ST2.view = v.dataset.v; try { sessionStorage.setItem('tel2.statview', ST2.view); } catch (x) { /* pole oluline */ } return renderStat(); }
  if (e.target.id === 'sRef') { ST2.normRows = null; return loadStat(true); }
  const nm = e.target.closest('[data-nm]'); if (nm) { ST2.mode = nm.dataset.nm; return renderStat(); }
  const ng = e.target.closest('[data-ng]'); if (ng) { ST2.grp = ng.dataset.ng; return renderStat(); }
  const det = e.target.closest('[data-det]');
  if (det) { T2.q = det.dataset.det.toLowerCase(); T2.st = new Set(ALL_ST); T2.who = ''; T2.pink = ''; T2.lim = 300; setTab('tabel'); return; }
  const pd = e.target.closest('[data-pdel]');
  if (pd && ISADMIN()) {
    if (!confirm('Kustutan selle puhkuse?')) return;
    const { error } = await sb.from('puhkused').delete().eq('id', Number(pd.dataset.pdel));
    if (error) return showToast({ bad: true, text: 'Ei õnnestunud', sub: error.message });
    ST2.data.puh = ST2.data.puh.filter((p) => p.id !== Number(pd.dataset.pdel)); showToast({ text: 'Puhkus kustutatud' }); return renderStat();
  }
  if (e.target.id === 'pAdd' && ISADMIN()) {
    const rec = { profiil_id: $('pWho').value, liik: $('pLiik').value, algus: $('pA').value, lopp: $('pL').value || $('pA').value, markus: $('pM').value.trim() || null };
    if (!rec.profiil_id || !rec.algus) return showToast({ bad: true, text: 'Vali töötaja ja algus' });
    if (rec.lopp < rec.algus) return showToast({ bad: true, text: 'Lõpp peab olema pärast algust' });
    const { data, error } = await sb.from('puhkused').insert(rec).select().single();
    if (error) return showToast({ bad: true, text: 'Ei õnnestunud', sub: error.message });
    ST2.data.puh.push(data); showToast({ text: 'Puhkus lisatud', sub: wName(rec.profiil_id) + ', ' + wdBetween(rec.algus, rec.lopp) + ' tööpäeva' }); return renderStat();
  }
});
$('stat').addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'sYear') { ST2.year = Number(t.value); return loadStat(); }
  if (t.id === 'sMonth') { ST2.month = Number(t.value); return renderStat(); }
  if (t.id === 'nWho') { ST2.nwho = t.value; return renderStat(); }
  if (t.id === 'nThr') { ST2.thr = Number(t.value); return renderStat(); }
  if (!ISADMIN()) return;
  if (t.id === 'sGoal') { const v = Number(t.value); if (!(v > 0)) return showToast({ bad: true, text: 'Vigane eesmärk' }); if (await setSeade('kuu_normi_eesmark', v)) renderStat(); return; }
  if (t.dataset.days !== undefined) {
    const m = Number(t.dataset.days); const v = t.value === '' ? null : Number(t.value);
    if (v !== null && !(v >= 0 && v <= 31)) return showToast({ bad: true, text: 'Vigane tööpäevade arv' });
    if (await setSeade('toopaevi_' + ST2.year + '_' + pad(m + 1), v)) renderStat(); return;
  }
  if (t.dataset.nn) {
    const v = t.value === '' ? null : Number(t.value);
    const { error } = await sb.from('profiilid').update({ nadala_norm: v }).eq('id', t.dataset.nn);
    if (error) return showToast({ bad: true, text: 'Ei õnnestunud', sub: error.message + (/nadala_norm/.test(error.message) ? ' (käivita sql/21)' : '') });
    const w = T2.workers.find((x) => x.id === t.dataset.nn); if (w) w.nadala_norm = v;
    const p = S.profiles.find((x) => x.id === t.dataset.nn); if (p) p.nadala_norm = v;
    showToast({ text: 'Nädala norm salvestatud' }); return renderStat();
  }
});

start();
