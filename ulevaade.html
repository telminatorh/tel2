<style>

  .lgrp .mut { color: var(--muted); font-size: 13px; }
  .chip .t em { font-style: normal; font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; background: var(--late); padding: 0 5px; }
  .qchip { height: 30px; padding: 0 10px; border: 1px solid var(--line2); background: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; border-left-width: 3px; }

  .qchip:hover { border-color: var(--ink); }
  .qchip.late { border-left-color: var(--late); } .qchip.late span { color: var(--late); }
  .qchip.today { border-left-color: #B28600; }
  .qchip.warn { border-left-color: #F1C21B; }
  .qchip.out { border-left-color: var(--out); }
  .qchip.ready { border-left-color: var(--done); }
  .qchip.on { background: var(--ink); color: #fff; border-color: var(--ink); } .qchip.on span { color: #C6C6C6; }
  .loads .lh { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .loads .lh b { font-size: 13px; }

  .pb i { display: block; height: 100%; }

  .ord-h:hover { background: #FAFAFA; }
  .ord.open .ord-h { background: #EDF5FF; }
  .ord.ready .ord-h { background: #DEFBE6; }

  .cl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl small { display: block; color: var(--muted); font-size: 12px; }
  .mono { font-family: var(--mono); }
  .r { text-align: right; }
  .cells { display: flex; gap: 3px; flex-wrap: wrap; }

  table.pos th button { all: unset; cursor: pointer; }
  table.pos th button:focus-visible { outline: 2px solid var(--accent); }

  table.pos tr:hover td { background: #FAFAFA; }

  .load:last-child { border-bottom: none; }

  .load .t span { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .meter { height: 10px; background: var(--bg); display: flex; }

function loadLib(url, name) {

$('list').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input.note')) e.target.blur(); });
$('list').addEventListener('focusout', async (e) => {
  const inp = e.target; if (!inp.matches || !inp.matches('input.note')) return;
  const r = S.rows.find((x) => x.id === Number(inp.dataset.m)); if (!r) return;
  const v = inp.value.trim() || null; if ((r.markused || null) === v) return;
  const { error } = await sb.from('tellimuse_read').update({ markused: v }).eq('id', r.id);
  if (error) { inp.value = r.markused || ''; return toast(error.message, true); }
  r.markused = v; inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 1200);
  toast('Märkus salvestatud');
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) load(); });

start();
</script>
</body>
</html>
