<style>

  @media (max-width: 680px) {

<body>
<div class="login hidden" id="login">
  <form id="loginForm">
    <h1>TEL 2.0</h1>
    <div class="field"><label for="email">E-post</label><input type="email" id="email" autocomplete="username" required></div>

    <button class="primary" type="submit">Logi sisse</button>

</div>

<div class="app hidden" id="app">

    <span class="brand">TEL 2.0</span><span>Ülevaade</span>
    <span class="sp"></span><small id="upd"></small>
    <button type="button" id="refresh">Värskenda</button>
    <button type="button" onclick="location.href='index.html'">Avaleht</button>
    <button type="button" id="logout">Logi välja</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="main">
    <section class="orders">
      <div class="bar">
        <div class="seg" id="view"></div>
        <div class="seg" id="seg" style="margin-right:auto"></div>
        <select class="search" id="per" aria-label="Periood" style="width:auto">
          <option value="">Kogu aeg</option><option value="m0">See kuu</option><option value="m1">Eelmine kuu</option>
          <option value="d30">Viimased 30 päeva</option><option value="d90">Viimased 90 päeva</option><option value="y0">See aasta</option>
        </select>
        <input class="search" id="q" type="search" placeholder="Otsi: tellimus, kliendi tellimus, joonise nr, klient" aria-label="Otsi">
      </div>
      <div id="list"></div>
    </section>
    <aside>
      <div class="box"><h3>Koormus töötajate kaupa <small>lahtised h</small></h3><div id="loadW"></div></div>
      <div class="box"><h3>Koormus pinkide kaupa <small>lahtised h</small></h3><div id="loadP"></div></div>
      <div class="box"><h3>Väljas (pinnakate, allhange) <small id="outN"></small></h3><div id="outL"></div></div>

<div id="toast" class="hidden" role="status"></div>
<div id="fpop" class="hidden" role="dialog" aria-label="Filter"></div>
<div id="pv" class="hidden" aria-hidden="true"><img alt=""><small>Klõps avab suurelt</small></div>

<script>
const SUPABASE_URL = 'https://abbwugsoakvirqlmovzt.supabase.co';
const SUPABASE_KEY = 'sb_publishable__5gmN-qWgogdCAJ7GAZq0w_XBA93LKs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const localIso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => localIso(new Date());
const dayDiff = (iso) => Math.round((Date.parse(iso) - Date.parse(today())) / 86400000);
const ddmm = (iso) => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) : '–';
const h1 = (n) => (Math.round((n || 0) * 10) / 10).toFixed(1).replace('.', ',');
const eur = (n, d = 0) => (n || 0).toLocaleString('et-EE', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' €';
const LBL = { cam: 'CAM teha', toos: 'Töös', ok: 'OK', pinnakattes: 'Pinnakattes', allhankes: 'Allhankes', valmis: 'Valmis' };
const ORDER = ['cam', 'toos', 'ok', 'pinnakattes', 'allhankes', 'valmis'];
const OPEN = ['cam', 'toos'];          // töökojas tegemata
const OUT = ['pinnakattes', 'allhankes'];
const TOOS = ['cam', 'toos', 'allhankes'];          // tootmises / pooleli
const VALMISG = ['ok', 'pinnakattes', 'valmis'];    // valmis & pinnakattes
const KUUD = ['jaanuar', 'veebruar', 'märts', 'aprill', 'mai', 'juuni', 'juuli', 'august', 'september', 'oktoober', 'november', 'detsember'];

const S = { me: null, rows: [], orders: [], okAt: {}, sinceAt: {}, urls: {}, f: 'pooleli', q: '', per: '', open: new Set(), cf: {}, fOpen: null, view: 'read', sort: { k: 'tahtaeg', dir: 1 } };

// ------------------------------------------------------------ sisselogimine
async function start() { const { data } = await sb.auth.getSession(); if (data.session) enter(data.session.user); else showLogin(); }
function showLogin(m) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('loginErr').textContent = m || ''; }
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  if (error) return ($('loginErr').textContent = 'Vale e-post või parool.');

function meter(parts, max) {

}
function loadBox(key) {
  const g = new Map();
  S.rows.filter((r) => OPEN.includes(r.staatus) && !r.allhange).forEach((r) => {
    const k = r[key]; if (!g.has(k)) g.set(k, { cam: 0, toos: 0, late: 0, n: 0 });
    const x = g.get(k); x[r.staatus] += r.norm; x.n++; if (r.tahtaeg && dayDiff(r.tahtaeg) < 0) x.late++;
  });
  const arr = [...g.entries()].sort((a, b) => (b[1].cam + b[1].toos) - (a[1].cam + a[1].toos));
  const max = Math.max(1, ...arr.map(([, x]) => x.cam + x.toos));
  if (!arr.length) return '<div class="load" style="color:var(--muted)">Lahtisi töid pole.</div>';
  return arr.map(([k, x]) => '<div class="load"><div class="t"><b>' + esc(k) + '</b><span>' + x.n + ' tööd' + (x.late ? ', <span style="color:var(--late)">' + x.late + ' hilinenud</span>' : '') + ', ' + h1(x.cam + x.toos) + ' h</span></div>' +
    meter([[x.toos, '#78A9FF'], [x.cam, '#F1C21B']], max) + '</div>').join('');
}

async function patchRow(r, patch, el) {
  const { error } = await sb.from('tellimuse_read').update(patch).eq('id', r.id);
  if (error) { toast(error.message, true); await load(); return false; }
  Object.assign(r, patch);
  if ('norm' in patch) { r.normRaw = patch.norm; r.norm = Number(patch.norm || 0); }
  if ('pink_id' in patch || 'allhange' in patch) { const p = LK.pingid.find((x) => x.id === r.pink_id); r.pink = r.allhange ? 'Allhange' : (p ? p.nimi : 'Määramata'); }
  if ('teostaja_id' in patch || 'allhankija' in patch || 'allhange' in patch) { const t = LK.toomehed.find((x) => x.id === r.teostaja_id); r.teostaja = r.allhange ? (r.allhankija || 'Allhange') : (t ? t.nimi : 'Määramata'); }
  return true;
}
function autoNorm(r) {
  // norm = (tükihind - materjal) × kogus / pingi tunnihind
  const p = LK.pingid.find((x) => x.id === r.pink_id);
  const tk = r.kogus ? Number(r.hind_kokku || r.hind) / Number(r.kogus) : 0;
  if (!p || r.allhange || !tk) return null;
  return Math.max(0, Math.round((tk - Number(r.materjali_hind || 0)) * Number(r.kogus) / Number(p.tunnihind) * 100) / 100);
}

    else { patch = { allhange: false, allhankija: null, pink_id: el.value ? Number(el.value) : null }; if (r.staatus === 'allhankes') patch.staatus = 'cam';
      const tmp = { ...r, ...patch }; const n = autoNorm(tmp); if (n !== null) patch.norm = n; }
  } else if (f === 'teostaja_id') patch = { teostaja_id: el.value || null };

$('list').addEventListener('pointerover', (e) => {
  const im = e.target.closest('img.th'); if (!im || e.pointerType !== 'mouse') return;
  $('pv').querySelector('img').src = im.src; $('pv').classList.remove('hidden'); placePv(e);
});
$('list').addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && !$('pv').classList.contains('hidden')) placePv(e); });
$('list').addEventListener('pointerout', (e) => { if (e.target.closest('img.th')) $('pv').classList.add('hidden'); });
async function openPdfFor(r) {
  const win = window.open('', '_blank');
  const { data, error } = await sb.storage.from('joonised').createSignedUrl(r.joonised.pdf_path, 3600);
  if (error || !data) { if (win) win.close(); return toast('Joonist ei saanud avada', true); }
  if (win) win.location = data.signedUrl; else location.href = data.signedUrl;
}
$('list').addEventListener('click', (e) => {
  const im = e.target.closest('img.th'); if (!im) return;
  const r = S.rows.find((x) => x.id === Number(im.dataset.pdf)); if (!r) return;
  $('pv').classList.add('hidden');
  const lb = document.createElement('div'); lb.className = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-label', 'Joonis');
  lb.innerHTML = '<div class="cap">' + esc(r.nimetus) + (r.revisjon ? ' rev ' + esc(r.revisjon) : '') + ' · ' + esc(r.tel) + '</div><img src="' + esc(im.src) + '" alt="Joonis ' + esc(r.nimetus) + '">' +
    '<div class="lbb">' + (r.joonised?.pdf_path ? '<button type="button" class="pdf">Ava PDF</button>' : '') + '<button type="button" class="x">Sulge</button></div>';
  document.body.appendChild(lb);
  const close = () => { lb.remove(); document.removeEventListener('keydown', esc1); };
  const esc1 = (ev) => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', esc1);
  lb.addEventListener('click', (ev) => { if (ev.target === lb || ev.target.closest('.x')) close(); if (ev.target.closest('.pdf')) { openPdfFor(r); close(); } });
});
// märkuste muutmine real
$('list').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input.note')) e.target.blur(); });
$('list').addEventListener('focusout', async (e) => {
  const inp = e.target; if (!inp.matches || !inp.matches('input.note')) return;
  const r = S.rows.find((x) => x.id === Number(inp.dataset.m)); if (!r) return;
  const v = inp.value.trim() || null; if ((r.markused || null) === v) return;
  const { error } = await sb.from('tellimuse_read').update({ markused: v }).eq('id', r.id);
  if (error) { inp.value = r.markused || ''; return toast(error.message, true); }
  r.markused = v; inp.classList.add('saved'); setTimeout(() => inp.classList.remove('saved'), 1200);
  toast('Märkus salvestatud');
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) load(); });

start();
</script>
</body>
