async function patchRow(r, patch, el) {

function autoNorm(r) {
  // norm = (tükihind - materjal) × kogus / pingi tunnihind

}

  if (new Set(rows.map((r) => r.tarnija_id)).size !== 1) return toast('Vali ühe mehe read', true);
  const sum = rows.reduce((a, r) => a + tasuSum(r), 0); const r0 = rows[0];
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="max-width:460px" role="dialog" aria-label="Väljamakse"><header><b>Väljamakse: ' + esc(r0.tarnija) + ' (' + r0.grupp + ')</b><button type="button" data-x aria-label="Sulge">×</button></header>' +
    '<div class="mb" style="display:flex;flex-direction:column;gap:10px"><div>' + rows.length + ' detaili, tasu kokku <b class="mono">' + eur(sum, 2) + '</b></div>' +
    '<label>Kuupäev<input type="date" id="vmD" value="' + localIso(new Date()) + '"></label><label>Märkus<input id="vmM" placeholder="nt sularahas / pangaülekanne"></label>' +
    '<div style="font-size:12px;color:var(--muted)">Ostuarvete alla tekib kirje "Allhange ' + r0.grupp + '" (tasutud). Selle kustutamine muudab read uuesti tasumata.</div><div class="err" id="vmE"></div></div>' +
    '<div class="ft"><button type="button" data-x>Tühista</button><button type="button" class="primary" id="vmOk">Märgi makstuks</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => bg.remove());
  bg.querySelector('#vmOk').onclick = async () => {
    bg.querySelector('#vmOk').disabled = true;
    const { error } = await sb.rpc('allhange_maksa', { p_read: rows.map((r) => r.id), p_kuupaev: bg.querySelector('#vmD').value || null, p_markus: bg.querySelector('#vmM').value || null });
    if (error) { bg.querySelector('#vmOk').disabled = false; bg.querySelector('#vmE').textContent = error.message; return; }
    bg.remove(); S.pick.clear(); toast(r0.tarnija + ': makstud ' + eur(sum, 2)); load();
  };
}
function openArvestus() {
  const d = new Date(), mStart = (y, m) => localIso(new Date(y, m, 1)), mEnd = (y, m) => localIso(new Date(y, m + 1, 0));
  const P = { from: mStart(d.getFullYear(), d.getMonth()), to: localIso(d) };
  const people = LK.tarnijad.filter((t) => t.grupp);
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="max-width:760px" role="dialog" aria-label="TR/FR arvestus"><header><b>TR / FR arvestus</b><button type="button" data-x aria-label="Sulge">×</button></header>' +
    '<div class="mb" style="display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button type="button" class="btn" data-p="m0">See kuu</button><button type="button" class="btn" data-p="m1">Eelmine kuu</button><button type="button" class="btn" data-p="y">See aasta</button>' +
        '<span style="flex:1"></span><input type="date" id="arF" value="' + P.from + '" style="width:150px"> – <input type="date" id="arT" value="' + P.to + '" style="width:150px"></div>' +
      '<div id="arOut">Laen…</div>' +
      '<details id="arNew"><summary style="cursor:pointer;font-weight:600">+ Vaba kulu (ilma detailita, nt tunnitöö)</summary><div style="display:grid;grid-template-columns:140px 1fr 110px;gap:8px;margin-top:8px">' +
        '<label>Kuupäev<input type="date" id="vkD" value="' + localIso(d) + '"></label><label>Mees<select id="vkT"><option value="">–</option>' + people.map((t) => '<option value="' + t.id + '">' + esc(t.nimi) + ' (' + t.grupp + ')</option>').join('') + '</select></label>' +
        '<label>Summa, €<input id="vkS" inputmode="decimal"></label><label style="grid-column:1/3">Kirjeldus<input id="vkK" placeholder="nt lisatöö 12 h"></label><label>&nbsp;<button type="button" class="primary" id="vkOk" style="height:38px">Lisa (makstud)</button></label></div>' +
        '<div class="err" id="vkE"></div></details>' +
      (people.length ? '' : '<div style="color:var(--late)">Ühelgi tarnijal pole gruppi TR/FR – määra see Kontor → Tarnijad.</div>') +
    '</div><div class="ft"><button type="button" data-x>Sulge</button></div></div>';
  document.body.appendChild(bg);
  const q = (id) => bg.querySelector('#' + id);
  bg.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => bg.remove());
  const run = async () => {
    P.from = q('arF').value; P.to = q('arT').value; q('arOut').textContent = 'Laen…';
    const { data, error } = await sb.from('ostuarved').select('id,kuupaev,tarnija,tarnija_id,summa,liik,kirjeldus,kommentaar').in('liik', ['Allhange TR', 'Allhange FR']).gte('kuupaev', P.from).lte('kuupaev', P.to).order('kuupaev');
    if (error) { q('arOut').textContent = error.message; return; }
    const g = new Map(); const key = (grp, nimi) => grp + '|' + nimi;
    const add = (grp, nimi, f, v) => { const k = key(grp, nimi); if (!g.has(k)) g.set(k, { grp, nimi, toos: 0, tas: 0, mak: 0 }); g.get(k)[f] += v; };
    S.rows.filter((r) => r.tasu === 'töös' || r.tasu === 'tasumata').forEach((r) => add(r.grupp, r.tarnija, r.tasu === 'töös' ? 'toos' : 'tas', tasuSum(r)));
    (data || []).forEach((x) => add(x.liik.slice(-2), x.tarnija, 'mak', Number(x.summa || 0)));
    const rows = [...g.values()].sort((a, b) => a.grp.localeCompare(b.grp) || a.nimi.localeCompare(b.nimi, 'et'));
    const tr = (x, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + esc(x.grp) + '</td><td>' + esc(x.nimi) + '</td><td class="r">' + eur(x.toos, 2) + '</td><td class="r"' + (x.tas ? ' style="color:var(--late)"' : '') + '>' + eur(x.tas, 2) + '</td><td class="r"><b>' + eur(x.mak, 2) + '</b></td></tr>';
    const sumOf = (arr, grp, nimi) => arr.reduce((a, x) => ({ grp, nimi, toos: a.toos + x.toos, tas: a.tas + x.tas, mak: a.mak + x.mak }), { grp, nimi, toos: 0, tas: 0, mak: 0 });
    let body = '';
    ['TR', 'FR'].forEach((gr) => { const a = rows.filter((x) => x.grp === gr); if (a.length) body += a.map((x) => tr(x)).join('') + tr(sumOf(a, gr, 'Kokku ' + gr), 'sub'); });
    body += tr(sumOf(rows, '', 'KOKKU'), 'sub');
    q('arOut').innerHTML = '<table class="artab"><thead><tr><th>Grupp</th><th>Mees</th><th class="r" title="Allhankes / pooleli detailid (ostuhind × kogus), praegu">Töös</th><th class="r" title="Detail valmis, tasu maksmata, praegu">Tasumata</th><th class="r" title="Väljamaksed + vabad kulud valitud perioodis">Kulu perioodis</th></tr></thead><tbody>' + body + '</tbody></table>' +
      '<details style="margin-top:8px"><summary style="cursor:pointer">Väljamaksed ja kulud perioodis (' + (data || []).length + ')</summary><table class="artab" style="margin-top:6px">' +
      (data || []).map((x) => '<tr><td class="mono">' + esc(ddmm(x.kuupaev)) + '</td><td>' + esc(x.tarnija) + ' <small class="gtag">' + esc(x.liik.slice(-2)) + '</small></td><td class="r">' + eur(Number(x.summa), 2) + '</td><td style="color:var(--muted)">' + esc([x.kirjeldus, x.kommentaar].filter(Boolean).join(' · ')) + '</td></tr>').join('') + '</table></details>';
  };
  bg.addEventListener('click', (e) => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    const y = d.getFullYear(), m = d.getMonth();
    if (b.dataset.p === 'm0') { q('arF').value = mStart(y, m); q('arT').value = localIso(d); }
    if (b.dataset.p === 'm1') { q('arF').value = mStart(y, m - 1); q('arT').value = mEnd(y, m - 1); }
    if (b.dataset.p === 'y') { q('arF').value = y + '-01-01'; q('arT').value = localIso(d); }
    run();
  });
  q('arF').onchange = run; q('arT').onchange = run;
  q('vkOk').onclick = async () => {
    const t = people.find((x) => x.id === Number(q('vkT').value)); const s = toNum(q('vkS').value);
    if (!t) return (q('vkE').textContent = 'Vali mees.');
    if (!s || s <= 0) return (q('vkE').textContent = 'Sisesta summa.');
    const kp = q('vkD').value || localIso(d);
    const { error } = await sb.from('ostuarved').insert({ kuupaev: kp, kande_kp: kp, tarnija: t.nimi, tarnija_id: t.id, summa: s, tasutud: s, kirjeldus: q('vkK').value.trim() || 'Vaba kulu', liik: 'Allhange ' + t.grupp, km_maar: 0, allikas: 'kasitsi' });
    if (error) return (q('vkE').textContent = error.message);
    q('vkS').value = ''; q('vkK').value = ''; q('vkE').textContent = ''; toast('Kulu lisatud: ' + t.nimi + ' ' + eur(s, 2)); run();
  };
  run();
}
// ---- pinnakatte / allhanke tellimus -> ostutellimus
async function createPo(rows, liik) {
  const { data: tl, error: te } = await sb.from('tarnijad').select('id,nimi,liik,email,aktiivne').eq('aktiivne', true).order('nimi');
  if (te) return toast(te.message, true);
  const own = (tl || []).filter((t) => t.liik === liik), other = (tl || []).filter((t) => t.liik !== liik);
  const { data: used } = await sb.from('ostutellimuse_read').select('rida_id, ostutellimused!inner(nr,olek)').in('rida_id', rows.map((r) => r.id)).neq('ostutellimused.olek', 'tuhistatud');
  const tids = [...new Set(rows.map((r) => r.tarnija_id || null))]; const pre = liik === 'allhange' && tids.length === 1 ? tids[0] : null;   // ridade ühine tarnija ette
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal" style="max-width:520px" role="dialog" aria-label="Uus ostutellimus"><header><b>' + (liik === 'pinnakate' ? 'Pinnakatte' : 'Allhanke') + ' tellimus: ' + rows.length + ' positsiooni</b><button type="button" data-x aria-label="Sulge">×</button></header>' +
    '<div class="mb" style="display:flex;flex-direction:column;gap:10px">' +
      '<label>Tarnija<select id="poT"><option value="">–</option>' + own.map((t) => '<option value="' + t.id + '"' + (t.id === pre ? ' selected' : '') + '>' + esc(t.nimi) + '</option>').join('') +
        (other.length ? '<optgroup label="Teised tarnijad">' + other.map((t) => '<option value="' + t.id + '"' + (t.id === pre ? ' selected' : '') + '>' + esc(t.nimi) + '</option>').join('') + '</optgroup>' : '') + '</select></label>' +
      '<label>…või uus tarnija<input id="poN" placeholder="Tarnija nimi"></label>' +
      (liik === 'pinnakate' ? '<label>Pinnakate (kõigile ridadele)<select id="poP"><option value="">(jäta rea oma)</option>' + LK.pinnakatted.filter((x) => x.aktiivne).map((x) => '<option>' + esc(x.nimetus) + '</option>').join('') + '</select></label>' : '') +
      (used && used.length ? '<div style="color:var(--late);font-size:13px">' + used.length + ' valitud rida on juba ostutellimusel (' + [...new Set(used.map((u) => u.ostutellimused.nr))].join(', ') + '), need jäetakse vahele.</div>' : '') +
      '<div style="font-size:12px;color:var(--muted)">Luuakse ostutellimus ja avatakse see. Seal saad lisada hinnad, tarneaja ja saata kirja koos joonistega.</div><div class="err" id="poE"></div></div>' +
    '<div class="ft"><button type="button" data-x>Tühista</button><button type="button" class="primary" id="poOk">Loo ostutellimus</button></div></div>';
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => bg.remove());
  bg.querySelector('#poOk').onclick = async () => {
    const err = (m) => { bg.querySelector('#poE').textContent = m; };
    let tid = Number(bg.querySelector('#poT').value) || null;
    const nn = bg.querySelector('#poN').value.trim();
    if (nn) { const { data, error } = await sb.from('tarnijad').insert({ nimi: nn, liik }).select('id').single(); if (error) return err(error.code === '23505' ? 'Selline tarnija on juba olemas.' : error.message); tid = data.id; }
    if (!tid) return err('Vali tarnija.');
    const skip = new Set((used || []).map((u) => u.rida_id));
    const go = rows.filter((r) => !skip.has(r.id));
    if (!go.length) return err('Kõik valitud read on juba ostutellimusel.');
    const pk = bg.querySelector('#poP') ? bg.querySelector('#poP').value : '';
    const { data: po, error } = await sb.from('ostutellimused').insert({ tarnija_id: tid, liik }).select('id').single();
    if (error) return err(error.message);
    const { error: e2 } = await sb.from('ostutellimuse_read').insert(go.map((r) => ({ ostutellimus_id: po.id, rida_id: r.id, nimetus: r.nimetus + (r.revisjon ? ' rev ' + r.revisjon : ''), kogus: r.kogus, uhik: r.uhik || 'tk' })));
    if (e2) return err(e2.message);
    if (pk) await sb.from('tellimuse_read').update({ pinnakate: pk }).in('id', go.map((r) => r.id));
    if (liik === 'allhange' && !S.noV29) { const ids = go.filter((r) => r.allhange && !r.tarnija_id).map((r) => r.id); if (ids.length) await sb.from('tellimuse_read').update({ tarnija_id: tid }).in('id', ids); }
    S.pick.clear();
    location.href = 'ostutellimused.html?id=' + po.id;
  };
}

// joonise eelvaade hiirega ja PDF topeltklõpsuga
const canHover = window.matchMedia('(hover: hover)').matches;
function placePv(e) {
  const pv = $('pv'); const w = 452, h = pv.offsetHeight || 340;
  let x = e.clientX + 18, y = e.clientY + 18;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 18;
  if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
  pv.style.left = x + 'px'; pv.style.top = y + 'px';
}
$('list').addEventListener('pointerover', (e) => {
  const im = e.target.closest('img.th'); if (!im || e.pointerType !== 'mouse') return;
  $('pv').querySelector('img').src = im.src; $('pv').classList.remove('hidden'); placePv(e);
});
$('list').addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && !$('pv').classList.contains('hidden')) placePv(e); });
$('list').addEventListener('pointerout', (e) => { if (e.target.closest('img.th')) $('pv').classList.add('hidden'); });
async function openPdfFor(r) {
  const win = window.open('', '_blank');
  const { data, error } = await sb.storage.from('joonised').createSignedUrl(r.joonised.pdf_path, 3600);
  if (error || !data) { if (win) win.close(); return toast('Joonist ei saanud avada', true); }
  if (win) win.location = data.signedUrl; else location.href = data.signedUrl;
}
$('list').addEventListener('click', (e) => {
  const im = e.target.closest('img.th'); if (!im) return;
  const r = S.rows.find((x) => x.id === Number(im.dataset.pdf)); if (!r) return;
  $('pv').classList.add('hidden');
  const lb = document.createElement('div'); lb.className = 'lb'; lb.setAttribute('role', 'dialog'); lb.setAttribute('aria-label', 'Joonis');
  lb.innerHTML = '<div class="cap">' + esc(r.nimetus) + (r.revisjon ? ' rev ' + esc(r.revisjon) : '') + ' · ' + esc(r.tel) + '</div><img src="' + esc(im.src) + '" alt="Joonis ' + esc(r.nimetus) + '">' +
    '<div class="lbb">' + (r.joonised?.pdf_path ? '<button type="button" class="pdf">Ava PDF</button>' : '') + '<button type="button" class="x">Sulge</button></div>';
  document.body.appendChild(lb);
  const close = () => { lb.remove(); document.removeEventListener('keydown', esc1); };
  const esc1 = (ev) => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', esc1);
  lb.addEventListener('click', (ev) => { if (ev.target === lb || ev.target.closest('.x')) close(); if (ev.target.closest('.pdf')) { openPdfFor(r); close(); } });
});
// märkuste muutmine real
$('list').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('input.note')) e.target.blur(); });
$('list').addEventListener('focusout', async (e) => {
  const inp = e.target; if (!inp.matches || !inp.matches('input.note')) return;
  const r = S.rows.find((x) => x.id === Number(inp.dataset.m)); if (!r) return;
  const v = inp.value.trim() || null; if ((r.markused || null) === v) return;

});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) load(); });

start();
